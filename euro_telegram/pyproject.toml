[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euro-telegram"
version = "0.1.0"
description = "Historical Euro draw analyzer and Telegram combination sender"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
]

[project.scripts]
euro = "euro.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["euro*"]
