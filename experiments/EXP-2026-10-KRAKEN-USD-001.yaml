baseline_note: >
  No historical cohort on this database reaches the sample gate: the
  largest is 51 matched trades over 12 trading days. This experiment
  therefore establishes the baseline rather than comparing against one.
  Because gate G7 requires a baseline comparison, the best attainable
  outcome here is FAIL or INSUFFICIENT_EVIDENCE; PASS is unreachable by
  construction. That is intended: the purpose is to measure, and to
  create the baseline that EXP-...-002 can be compared against.

