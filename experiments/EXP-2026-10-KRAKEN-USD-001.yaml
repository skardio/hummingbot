# The abort is formally correct, but the cause is an instrumentation
# defect rather than a trading loss. Recorded in full so the next
# experiment is not designed around a false conclusion.
abort_diagnosis:
  summary: >
    A single executor (XDC-USD) booked -33.3897 USD while the position was
    in fact fully closed at a profit of +0.4642 USD. The 96.7% operational
    share is an artefact of that mis-booking, not of operational losses.
  executor_id: "DXswj7E81kirvTsy"
  trading_pair: "XDC-USD"
  opened_at: "2026-10-06T03:08:12Z"
  closed_at: "2026-10-06T04:20:19Z"
  close_type: 8                            # FAILED
  classified_as: "PARTIAL_OPEN"

  ground_truth_from_tradefill:
    bought_base: 2020.6410
    bought_quote: 67.0752
    sold_base: 2020.6411
    sold_quote: 67.5394
    residual_base: -0.0001
    economic_result_quote: 0.4642

  booked_by_executor:
    realized_buy_size_quote: 67.08
    realized_sell_size_quote: 34.09
    net_pnl_quote: -33.3897
  accounting_error_quote: -33.85

  root_cause: >
    Order 461474338 was placed for the full 2020.6411 XDC, was partially
    filled for 999.9440 XDC (33.4481 USD), and was then cancelled. The
    cancellation path records only the order id in _canceled_orders and
    resets the level; the partial fill is never carried over into
    _filled_orders. Because realized_sell_size_quote is summed exclusively
    from _filled_orders, that 33.45 USD of proceeds disappears from the
    books while the matching purchase remains, producing a loss equal to
    the unsold notional.
  root_cause_location: >
    hummingbot/strategy_v2/executors/grid_executor/grid_executor.py
    process_order_canceled_event() lines 4507-4545, combined with
    update_realized_pnl_metrics() lines 4849-4866.

  # Applied to the full history of this database: 3 of the 14
  # UNMATCHED_BUY/PARTIAL_OPEN executors show sell fills on cancelled
  # orders that were never counted.
  historical_exposure:
    affected_executors: 3
    unaccounted_proceeds_quote: 144.51
    examples: ["PEPE-USD -56.02", "PEPE-USD -0.21", "XDC-USD -33.39"]
    note: >
      This supersedes the "terminal-fill race" hypothesis recorded during
      the Part A investigation, which was inferred from timestamps. The
      remaining 11 executors show no fills on cancelled orders and stay
      unexplained.

  capital_impact: "none - the position closed at a profit; no kill switch fired"
  bot_state_at_abort: "running, 0 errors, no risk pause, no executors created since the event"

# EXP-001 is closed, not repaired. The fix touches grid_executor.py, a
# frozen surface, so the follow-up runs under a new id.
successor_experiment: "EXP-2026-10-KRAKEN-USD-002 (after the fix is verified)"
preconditions_for_successor:
  - "partial fills on cancelled orders are counted in realized PnL"
  - "regression test reproducing the XDC-USD case passes"
  - "a re-run over history shows the 3 affected executors reclassified"
  - "new fingerprint computed and frozen under a new contract"

does_not_prove: >
  Says nothing about other venues, other quote currencies, other capital
  levels, or market regimes outside the measurement window. A result here
  does not transfer to Bitget, and does not justify increasing position
  size.
