# ------------------------------------------------- abort conditions ---
# Any single condition below ends the experiment. Thresholds mirror the
# policy; the engine evaluates them, the operator acts on them.
abort_conditions:
  - id: "ABORT-FINGERPRINT"
    condition: "any closed executor carries a config_fingerprint != 49344cef79"
    source: "tools/evidence fingerprint over config JSON"
    action: "EXPERIMENT IMMEDIATELY INVALID - stop, do not analyse, open a new id"
  - id: "ABORT-POLICY"
    condition: "evidence_policy.yaml policy_version != 1.3.0"
    source: "config/evidence_policy.yaml"
    action: "EXPERIMENT INVALID (POLICY_DRIFT) - open a new id"
  - id: "ABORT-DATA"
    condition: "gate G0 fails: leg identity, A==B+C, negative fees or implausible fee rate"
    source: "policy data_integrity"
    action: "stop and investigate before collecting further"
  - id: "ABORT-OPERATIONAL"
    condition: "operational_share_of_total > 0.25"
    source: "policy operational.max_operational_share_of_total"
    action: "stop; view B is no longer representative"
  - id: "ABORT-UNMATCHED-BUY"
    condition: "unmatched_buy_rate > 0.10"
    source: "policy operational.max_unmatched_buy_rate"
    action: "stop; the April-May accounting failure mode has returned"
  - id: "ABORT-DRAWDOWN"
    condition: "cumulative realized-PnL-sequence drawdown of view A < -25.00 USD"
    source: "contract; 8.32% of the 300.40 USD available balance"
    action: "stop and protect capital"
  - id: "ABORT-RISK"
    condition: "the bot's own daily loss limit trips (max_daily_loss_pct 3.0)"
    source: "spot_grid_kraken_usd.yaml:1016-1017"
    note: >
      Resolves to 9.00 USD, which is 3.00% of the available balance -
      the limit is calibrated correctly.
    action: "stop; a risk halt invalidates the trading-day count"
  - id: "ABORT-CLASSIFICATION"
    condition: "heuristic_share_of_b > 0.20 or dust sweep reports DUST_SENSITIVE"
    source: "policy classification"
    action: "stop; the verdict would rest on a threshold"
  - id: "ABORT-TIMEOUT"
    condition: "period_end_latest reached without min_sample_size"
    action: "close as INSUFFICIENT_EVIDENCE (SAMPLE); do not extend"

