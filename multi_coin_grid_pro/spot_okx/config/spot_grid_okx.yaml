    max_trend_24h_pct: 45.0

  PEPE-USDC:
    min_wick_ratio: 0.00
    max_atr_pct_for_grid: 10
    vwap_max_deviation_pct: 20.0
    rsi_extreme_low: 16.0
    rsi_block_min: 84.0
    max_trend_24h_pct: 45.0

# ==============================================================================
# GRID CONFIGURATION (Hybrid Grid Engine)
# ==============================================================================

grid_range_pct_down: 2.0
grid_range_pct_up: 5.0

num_grids: 7
min_grid_level_spacing_pct: 0.60  # Align met Bitget/Kraken USD voor snellere grid fills

use_dynamic_grid_sizer: true

dynamic_grid_sizer:
  min_grids: 5
  max_grids: 10
  low_vol_atr_pct: 0.7
  mid_vol_atr_pct: 2.0
  high_vol_atr_pct: 4.0

use_atr_grid_ranges: true
atr_multiplier_down: 1.5
atr_multiplier_up: 2.0

use_asymmetric_grids: true
smart_refill_threshold_pct: 3.0

# ==============================================================================
# TREND ENGINE
# ==============================================================================

use_multi_timeframe: true
trend_lookback_short_minutes: 60
trend_lookback_mid_minutes: 240
trend_lookback_long_minutes: 1440

switch_threshold_percent: 5.0
exit_short_threshold: -4.0
exit_mid_threshold: -3.0

trend_min_change_pct: 0.0015      # Originele waarde — gekalibreerd op trend_score (multi-timeframe), NIET op consensus_trend_pct
trend_min_entry_strength: 0.0015   # idem

# ==============================================================================
# COIN ROTATION & MONITORING
# ==============================================================================

coin_rotation_threshold: 180
pool_membership_cooldown_seconds: 1800
price_update_interval: 30

max_coin_monitoring_seconds: 600
session_blacklist_duration_seconds: 7200

coin_discovery_refresh_interval_seconds: 3600

# ==============================================================================
# CAPITAL & RISK MANAGEMENT (Grid-Aware)
# ==============================================================================

max_simultaneous_coins: 3         # Align met Bitget-profiel (Kraken draait op 2)

total_amount_quote: 150
risk_reference_balance_quote: 150
risk_bucket_limits:
  L1: 15.0
  L2: 40.0
  MEME: 20.0
  ILLIQUID: 10.0
  BLOCKED: 0.0
risk_max_daily_loss_pct: 3
min_order_amount_quote: 10        # OKX minimum ~$1; use $10 for safety

risk_max_balance_per_trade_pct: 100.0
risk_max_total_open_risk_pct: 100.0

max_exposure_per_coin_pct: 50.0
max_total_exposure_pct: 70.0

switch_grace_period_seconds: 600

# ==============================================================================
# PROFESSIONAL RISK MANAGEMENT
# ==============================================================================

use_professional_risk_mgmt: true

stop_loss_pct: 0.05
atr_stop_multiplier: 2.0
min_stop_pct: 0.02
max_stop_pct: 0.05

take_profit_pct: 0.05

# Trend-TP disabled: ATR-TP (dynamic_tp_enabled) already adjusts TP per-coin
# with a tighter cap. use_dynamic_take_profit would always be overridden.
use_dynamic_take_profit: false
min_take_profit_pct: 0.015
max_take_profit_pct: 0.08

daily_kill_switch_enabled: true
r_unit_quote: 5.0

capital_reserve_pct: 10.0

# Trailing stop:
#  Activation = 2.0% (above TP-min=1.5%, below TP-max=3%)
#  Minimum voor positief resultaat: activation > delta + fees = 1.0% + 0.16% = 1.16% ✓
trailing_stop_activation_pct: 0.020   # 2.0% — tussen TP-min (1.5%) en TP-max (3%)
trailing_stop_delta_pct: 0.010        # 1.0% pullback buffer

# Dynamic TP: scale with ATR
dynamic_tp_enabled: true
dynamic_tp_atr_multiplier: 0.60      # 🔧 2026-05-31: 0.35→0.60 (0.35 gaf altijd floor; bij ATR 4% nu 2.4%, bij 6% = 3.6%)
dynamic_tp_min_pct: 0.020            # 🔧 2026-05-31: 0.015→0.020 (OKX RT fees 0.14% → 2% floor geeft 1.86% netto)
dynamic_tp_max_pct: 0.04             # 🔧 2026-05-31: 0.03→0.04 (ruimere cap voor volatiele coins)

# Context-Aware Time Exits
time_based_stop_minutes: 360
time_stop_requires_stall: true
price_stall_threshold_atr: 0.3
min_minutes_since_last_fill: 45

# PnL-Driven Pauses
min_rolling_pnl_pct: -0.02
min_win_rate_threshold: 0.35
pause_cooldown_minutes: 30
resume_min_pnl_pct: 0.0

min_grid_profit_pct: 1.5             # OKX EU: hogere fees → hogere drempel nodig

# Crash Protection
emergency_exit_pct: -5.0
hard_stop_pct: -8.0

# ==============================================================================
# DRAWDOWN / KILL SWITCH
# ==============================================================================

max_daily_loss_pct: 3.0
max_weekly_loss_pct: 8.0
max_monthly_loss_pct: 12.0

# ==============================================================================
# TELEGRAM ALERTS
# ==============================================================================

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ==============================================================================
# ORDER MANAGEMENT
# ==============================================================================

max_open_orders: 100
order_frequency: 3

min_switch_interval_seconds: 1800
min_hold_time_seconds: 7200
max_hold_time_seconds: 21600

# ==============================================================================
# TREND-AWARE EXIT SYSTEM
# ==============================================================================

soft_hold_time_seconds: 7200
hard_hold_time_seconds: 21600
soft_exit_min_trend_pct: 0.3
soft_exit_max_loss_pct: -1.0
soft_exit_extend_seconds: 1800

# TIMEOUT LIFECYCLE
no_fill_timeout_sec: 3600
no_progress_timeout_sec: 3600
no_progress_min_loss_pct: 0.5
no_progress_atr_multiplier: 1.0
close_grace_sec: 600
coerce_tp_to_step: true            # Zorg dat TP >= 1 grid-stap (nodig voor coarse step-size exchanges)
fee_aware_timeout_bypass_sec: 1800

min_startup_wait_seconds: 60

smart_switch_k: 2.0
switch_cost_multiplier: 3.5

# ==============================================================================
# MOMENTUM SLEEVE (detect-only)
# ==============================================================================

momentum_sleeve:
  mode: paper                           # detect_only | paper | live
  enabled: true
  # --- paper/live trading params ---
  max_positions: 1
  max_quote_per_position: 25
  min_score: 75
  stop_loss_pct: 0.012
  take_profit_pct: 0.020
  trailing_activation_pct: 0.012
  trailing_distance_pct: 0.008
  max_hold_minutes: 90
  cooldown_minutes: 60
  summary_interval_minutes: 60
  # --- scoring gate params (used by MomentumCandidateScorer) ---
  min_score_to_enter: 25           # OKX EU: BTC scoort 13-28 in huidige markt; 30 blokkeert alles
  momentum_1h_min_pct: 0.5
  momentum_4h_min_pct: 1.0
  momentum_max_rsi: 80
  momentum_min_volume_expansion: 1.0
  momentum_regime_gate:
    - BULL
    - CHOP
  momentum_max_spread_pct: 0.15
  momentum_max_wick_risk: 0.7
  rejected_log_throttle_seconds: 300
  scorer_weights:
    trend_1h: 0.25
    trend_4h: 0.30
    volume_expansion: 0.20
    relative_strength: 0.15
    spread: 0.05
    rsi_wick_risk: 0.05

