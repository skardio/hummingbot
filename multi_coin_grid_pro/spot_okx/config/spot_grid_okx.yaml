# ==============================================================================
# OKX SPOT GRID CONFIG - Based on Bitget v3.3 / Kraken v3.3
# All advanced features enabled (Market Regime, Time Rules, Smart Sizing, etc.)
# Last updated: 2026-05-11
#
# OKX specifics vs Bitget:
#   - Fees:       0.20% maker / 0.35% taker (VIP0, OKX EU) — hoger dan OKX Global
#   - Liquidity:  Top-3 exchange globally, extremely deep books
#   - Rate limits: 60 orders/sec (generous)
#   - Passphrase: Required (like Bitget)
#   - Pairs:      -USDC suffix (MiCA: USDT niet beschikbaar op OKX EU; -USD pairs zijn NL-restricted via sCode=51155)
# ==============================================================================

controller_name: spot_grid_okx
log_level: INFO

# ==============================================================================
# DEBUG & TRACING
# ==============================================================================

debug_trace_enabled: true          # Enable decision trace logging
debug_trace_format: compact        # compact | detailed | json
debug_trace_log_accepted: false    # Only log rejections (reduces noise)
debug_trace_log_rejected: true     # Always log rejections

# ==============================================================================
# OBSERVABILITY (Phase 1A - Structured Events)
# ==============================================================================

observability:
  structured_events_enabled: true
  events_output_dir: "logs/events"
  buffer_size: 100
  why_no_trade_report_enabled: true
  report_interval_seconds: 3600

# ==============================================================================
# ORDERBOOK PREFETCH (Smart Subscription Strategy)
# ==============================================================================

orderbook_prefetch:
  enabled: true
  mode: 'live'
  top_n: 30
  max_subscriptions_per_minute: 20

# ==============================================================================
# ADAPTIVE REGIME DETECTION
# ==============================================================================

adaptive_regime_detection:
  enabled: true
  logging_only: false

  regime_smoothing_count: 1          # 🔧 2026-06-07: 3→1 (CHOP-filters blokkeerden alles tijdens bullrun; BEAR-vertraging via bear_min_duration_sec)

  bear_meanrev_policy: conditional    # block | conditional | allow
  bear_auto_light_enabled: true
  bear_auto_light_threshold: -5.0
  bear_size_multiplier: 0.5

  # Regime classification thresholds
  bull_score_min: 5.0
  chop_score_min: -3.0
  bear_score_max: -3.0
  min_confidence: 0.65

  # Hysteresis settings
  bull_min_duration_sec: 1800
  chop_min_duration_sec: 900
  bear_min_duration_sec: 1800
  hysteresis_buffer: 1.0

  log_regime_changes: true
  log_filter_updates: true

adaptive_filters:
  # Baseline filters (OKX SPOT — similar to Bitget but slightly tighter given higher liquidity)
  baseline:
    rsi_buy_min: 25.0
    rsi_buy_max: 78.0
    rsi_extreme_min: 15.0
    vwap_max_deviation_pct: 12.0
    max_up_accel_pct: 5.0
    max_down_accel_pct: -6.0
    atr_min_pct: 0.06              # OKX: very liquid, lower ATR floor viable
    atr_max_pct: 7.0
    spike_5m_max_pct: 4.0
    wick_ratio_min: 0.0
    grid_spacing_mult: 1.0
    max_active_grids: 4
    entry_confidence_min: 0.60

  BULL:
    rsi_buy_max: 85.0
    vwap_max_deviation_pct: 15.0
    max_up_accel_pct: 7.0
    max_down_accel_pct: -15.0
    atr_min_pct: 0.01              # 🔧 2026-06-07: 0.03→0.01 (bullrun: lage ATR-coins zoals PUMP mochten niet in)
    spike_5m_max_pct: 5.0
    max_trend_24h_pct: 25.0
    max_trend_4h_pct: 5.0
    grid_spacing_mult: 1.2
    max_active_grids: 6
    entry_confidence_min: 0.55

  CHOP:
    rsi_buy_max: 72.0
    vwap_max_deviation_pct: 10.0
    max_up_accel_pct: 2.5
    max_down_accel_pct: -4.0
    atr_min_pct: 0.06
    spike_5m_max_pct: 3.0
    max_trend_24h_pct: 15.0
    max_trend_4h_pct: 2.5
    grid_spacing_mult: 0.8
    max_active_grids: 3
    entry_confidence_min: 0.65

  BEAR:
    rsi_buy_max: 66.0
    vwap_max_deviation_pct: 10.0
    max_up_accel_pct: 2.0
    max_down_accel_pct: -3.0
    atr_min_pct: 0.08
    spike_5m_max_pct: 2.0
    max_trend_24h_pct: 10.0
    max_trend_4h_pct: 2.0
    grid_spacing_mult: 1.5
    max_active_grids: 1
    entry_confidence_min: 0.80
    bear_allow_meanrev: false

# ==============================================================================
# GRID SUITABILITY SCORER (Per-Coin Mean-Reversion Fitness)
# ==============================================================================

grid_suitability:
  enabled: true
  logging_only: false
  min_grid_score: 0.40
  lookback_candles: 48
  range_efficiency_max: 0.70

# === EXCHANGE CONFIGURATION ===
paper_trading: false              # Set to true for testing
connector_name: okx               # OKX SPOT connector
quote_asset: USDC                 # OKX EEA: -USDC pairs (BTC-USDC, ETH-USDC, etc.); -USD pairs zijn NL-restricted (sCode=51155)
balance_currency: USDC            # OKX EU wallet holds USDC

# ==============================================================================
# OKX SPOT — LIQUID UNIVERSE
# ==============================================================================

use_dynamic_pair_discovery: true
max_coins_to_monitor: 30

# ==============================================================================
# STALENESS GUARD
# ==============================================================================
max_price_age_ms: 35000
max_orderbook_age_ms: 60000
exclude_expensive_coins: false
min_24h_volume_quote: 1000000    # OKX is more liquid than Bitget; higher floor

use_dynamic_pair_manager: true
pair_scan_interval_seconds: 300
max_spread_pct: 0.50             # OKX EU USDC-paren; 0.15 filtert alles weg

# OKX EU-specific fee parameters (VIP0 tier — OKX EU, niet OKX Global)
okx_maker_fee_pct: 0.002         # 0.20% maker (OKX EU VIP0)
okx_taker_fee_pct: 0.0035        # 0.35% taker (OKX EU VIP0)

# OKX rate limiting (generous — 60 orders/sec)
rate_limit_buffer: 0.8
order_refresh_time: 30

blacklist:
  # Stablecoin pairs — USDT-USDC, EUR-USDC etc. bestaan niet op OKX EEA maar defensief opgenomen
  - USDT-USDC
  - BUSD-USDC
  - DAI-USDC
  - TUSD-USDC
  - FDUSD-USDC
  - EUR-USDC
  # NB: -USD pairs (NEAR-USD, LINK-USD etc.) worden niet meer geprobeerd (quote_asset=USDC)
  # Als -USDC pairs ook restricted zijn, hier toevoegen

manual_trading_pairs: []          # Empty = dynamic discovery mode

# ==============================================================================
# MULTI-TIMEFRAME BUY PROTECTION
# ==============================================================================

use_multi_timeframe_buy: true
mtf_1h_min_pct: -3.0
mtf_4h_min_pct: -2.5
mtf_24h_min_pct: -2.5
mtf_declining_1h_max: -4.0
mtf_declining_4h_max: -2.0

# ==============================================================================
# WARMUP TREND OVERRIDE – PRO PULLBACK MODE
# ==============================================================================

warmup_override_enabled: true
warmup_4h_strong_min: -2.5
warmup_1h_min_if_4h_strong: -3.0
warmup_max_minutes: 120
warmup_max_trend_24h_pct: 10.0
auto_sell_orphaned_positions: true

# ==============================================================================
# MARKET REGIME FILTER - BTC Trend Following
# ==============================================================================

market_regime:
  enabled: true
  btc_symbol: "BTC-USDC"

  btc_trend_1h_min_pct: -2.0
  btc_trend_4h_min_pct: -1.5
  btc_trend_24h_min_pct: -5.0

  dump_threshold_pct: -5.0
  dump_pause_minutes: 60

  altcoin_breadth_min_pct: 30.0
  altcoin_breadth_sample_pairs:
    - ETH-USDC
    - SOL-USDC
    - BNB-USDC
    - AVAX-USDC
    - LINK-USDC

  recovery_threshold_pct: 2.0

# ==============================================================================
# TIME-BASED TRADING RULES
# ==============================================================================

time_based_rules:
  enabled: false
  low_liquidity_hours: [0, 1, 2]
  low_liquidity_action: "monitor_only"
  high_liquidity_hours: [13, 14, 15, 16, 17, 18]
  high_liquidity_bonus_pct: 10.0
  max_total_size_multiplier: 1.2
  weekend_trading_enabled: true
  weekend_risk_multiplier: 0.5
  low_liquidity_overrides_weekend: true
  holidays: ["2025-12-25", "2026-01-01"]
  holiday_action: "reduce_size"
  holiday_risk_multiplier: 0.5

# ==============================================================================
# LIQUIDITY-AWARE SMART SIZING
# ==============================================================================

liquidity_aware_sizing:
  enabled: true
  sizing_priority: ["low_liquidity", "holiday", "weekend", "time_bonus", "regime_bonus", "volatility_bonus"]
  base_size_calculation: "capital_pct_daily"
  cumulative_check_enabled: true
  cumulative_log_level: "WARNING"
  time_bonus_scalar:
    high_liquidity: 1.10
    normal_hours: 1.00
    low_liquidity: 0.70
  regime_bonus_scalar:
    strong_bull: 1.15
    neutral: 1.00
    weak_bear: 0.60
  volatility_bonus_scalar:
    high_vol: 0.85
    normal_vol: 1.00
    low_vol: 1.10
  max_cumulative_multiplier: 1.20
  log_sizing_calc: true
  log_format: "JSON"

# ==============================================================================
# PERFORMANCE TRACKING
# ==============================================================================

performance_tracking:
  enabled: true
  min_win_rate_pct: 45.0
  min_profit_factor: 1.2
  min_sharpe_ratio: 0.5
  max_drawdown_pct: 5.0
  lookback_trades: 20
  lookback_days: 7
  report_interval_hours: 4
  save_to_database: true
  track_per_symbol: true
  min_trades_per_symbol: 3

# ==============================================================================
# ORDERBOOK DEPTH-BASED LIQUIDITY PROXY
# ==============================================================================

orderbook_liquidity:
  enabled: true
  mode: live
  regime_aware: true
  depth_pct_range: 0.5
  depth_levels: 10
  min_depth_multiplier: 5.0
  use_for_ranking: true
  use_for_entry: true
  log_depth_metrics: true

# ==============================================================================
# DYNAMIC SLOT MANAGER
# ==============================================================================

dynamic_slots:
  enabled: true
  min_slots: 1
  max_slots: 12
  regime_multipliers:
    BULL: 1.5
    CHOP: 0.75
    BEAR: 0.25

# ==============================================================================
# REGIME-FIRST COIN SELECTION
# ==============================================================================

regime_coin_selection:
  bear_allow_trading: true        # mirrors bear_meanrev_policy=conditional
  bear_max_grids: 1
  chop_use_grid_ranking: true
  chop_min_trend_pct: -0.003      # OKX EU: grid werkt ook in licht dalende markt (was 0.001 → blokkeerde alles)
  chop_max_trend_pct: 3.0
  bull_use_grid_ranking: false

# ==============================================================================
# FEE-AWARE FILTER
# OKX VIP0: 0.08% maker + 0.08% maker (limit/grid orders) = 0.16% RT
# ==============================================================================

fee_aware_filter:
  enabled: true
  taker_fee_pct: 0.35            # OKX EU VIP0 taker (0.35%)
  maker_fee_pct: 0.20            # OKX EU VIP0 maker (0.20%)
  fee_model: best_case           # LIMIT_MAKER (post_only) on OKX → gegarandeerd maker; 0.20+0.20=0.40% RT
  min_net_profit_pct: 0.40       # Align met Kraken USD profiel
  hourly_profit_check_enabled: true
  min_profit_per_hour_pct: 0.10  # P10 threshold voor OKX EU (hogere fees)
  fills_calibration_factor: 1.0

# ==============================================================================
# ST-11: IDLE MODE
# ==============================================================================

idle_mode:
  enabled: true
  no_edge_cycles_to_idle: 10
  idle_scan_interval_seconds: 120
  normal_scan_interval_seconds: 10
  log_interval_cycles: 5

# ==============================================================================
# ST-12: ECONOMIC EDGE GATE
# OKX EU: spread (0.50%) - costs (0.20%×2 + 0.03% slippage) = 0.07% edge
# min_edge_pct gelijk aan Kraken gezien vergelijkbare fee-structuur
# ==============================================================================

economic_edge_gate:
  enabled: true
  min_edge_pct: 0.15             # Vergelijkbaar met Kraken (OKX EU fees ~gelijk)
  include_spread_cost: false
  include_slippage_buffer_pct: 0.02  # Very low slippage on OKX (top-3 liquidity)

# ==============================================================================
# ENHANCED CLOSE COOLDOWNS
# ==============================================================================

close_cooldowns:
  failed_sec: 21600              # 6h cooldown after FAILED
  early_stop_sec: 10800          # 3h cooldown after EARLY_STOP
  stop_loss_sec: 21600           # 🔧 US15 2026-05-22: 6h cooldown after STOP_LOSS
  no_progress_sec: 3600          # 1h cooldown after timeout
  loss_streak_multiplier: 1.5
  max_streak_before_blacklist: 2  # 🔧 US11 2026-05-22: 3→2

# ==============================================================================
# US13: ATR-FEE GATE
# Blocks entry when ATR is too low to cover roundtrip fees.
# 2026-06-03 DISABLED: 5m ATR for liquid USDC pairs is 0.02-0.15%; threshold 0.80% is
# unreachable. smart_entry_filter.min_atr_pct_for_grid=0.06 provides the correct floor.
# ==============================================================================
atr_fee_gate:
  enabled: false                # was: true — 5m ATR threshold 0.80% blocks all liquid pairs
  min_atr_fee_multiplier: 2.0

# ==============================================================================
# ATR COIN SELECTION
# 2026-06-03 DISABLED: Pre-filter was blocking all 30 USDC pairs every cycle.
# Root cause: 5m ATR for liquid pairs (ETH, BTC, SOL) is 0.02-0.15%, far below
# the 0.40% soft threshold. Only trending/volatile coins (ALLO, ALGO) passed —
# exactly the WRONG coins for grid trading. GridScore (range_efficiency_max=0.70)
# handles coin ranking correctly; this pre-filter was counter-productive.
# ==============================================================================
atr_coin_selection:
  enabled: false                # was: true — was blocking all 30 coins every cycle
  prefilter_ratio: 0.50
  use_as_ranking_signal: true

# ==============================================================================
# US16: RE-ENTRY PRICE GUARD
# Blocks re-entry when current price has dropped significantly since last exit.
# ==============================================================================
reentry_price_guard:
  enabled: true
  max_drop_below_last_exit_pct: 0.50  # Block if price dropped > 0.50% vs last exit mid-price
  apply_after_close_types:
    - TAKE_PROFIT
    - STOP_LOSS
    - EARLY_STOP

# ==============================================================================
# REGIME-BASED TIMEOUTS
# ==============================================================================

regime_timeouts:
  bull_no_progress_sec: 3600
  chop_no_progress_sec: 3600
  bear_no_progress_sec: 2700
  bull_no_fill_sec: 3600
  chop_no_fill_sec: 3600
  bear_no_fill_sec: 2400

# ==============================================================================
# SMART ENTRY FILTER v2
# ==============================================================================

use_smart_entry_filter: true

smart_entry_filter:
  rsi_buy_max: 80.0
  rsi_extreme_low: 12.0
  rsi_block_min: 93.0             # Hard block: alleen bij extreme overbought (RSI > 93)

  vwap_max_deviation_pct: 12.0
  min_wick_ratio: 0.0

  max_atr_pct_for_grid: 7.0
  min_atr_pct_for_grid: 0.06     # OKX: very liquid, lower ATR floor

  max_5m_spike_pct: 4.0
  max_down_accel_pct: -6.0
  max_up_accel_pct: 5.0

  max_trend_4h_pct: 2.5
  max_trend_24h_pct: 15.0
  min_trend_24h_pct: -10.0

  max_entry_spread_pct: 0.35     # OKX EU USD-paren hebben bredere spreads; consistent met max_spread_pct: 0.50
  slippage_check_enabled: true

  min_depth_multiplier: 5.0
  depth_check_enabled: true

  # MOMENTUM HEALTH GUARDS
  vwap_slope_guard_enabled: true
  vwap_slope_guard_shadow_mode: true
  vwap_slope_dual_confirmation: true

  parabolic_detector_enabled: true
  parabolic_detector_shadow_mode: true
  parabolic_cooldown_minutes: 60
  parabolic_cooldown_persist: true

  market_exhaustion_enabled: true
  market_exhaustion_threshold_pct: 0.70
  market_exhaustion_sample_size: 10
  market_exhaustion_cooldown_min: 30
  market_exhaustion_telegram: true

  momentum_thresholds:
    baseline:
      slope_min_pct_5m: 0.05
      slope_min_pct_15m: 0.02
      slope_max_pct_15m: 0.30
      dev_max_pct: 5.0
      accel_5m_min_pct: 1.0
      accel_5m_max_pct: 5.0
      accel_15m_max_pct: 8.0
    regimes:
      BULL:
        slope_min_pct_5m: 0.00
        slope_min_pct_15m: 0.02
        slope_max_pct_15m: 0.40
        dev_max_pct: 8.0
        accel_5m_max_pct: 7.0
        accel_15m_max_pct: 12.0
      CHOP:
        slope_min_pct_5m: 0.05
        slope_min_pct_15m: 0.03
        slope_max_pct_15m: 0.25
        dev_max_pct: 4.0
        accel_5m_max_pct: 4.0
        accel_15m_max_pct: 6.0
      BEAR:
        slope_min_pct_5m: 0.10
        slope_min_pct_15m: 0.05
        slope_max_pct_15m: 0.20
        dev_max_pct: 3.0
        accel_5m_max_pct: 3.0
        accel_15m_max_pct: 5.0

