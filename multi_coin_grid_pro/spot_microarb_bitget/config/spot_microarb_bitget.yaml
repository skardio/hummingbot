  auto_discover_symbols: false
  max_symbols: 100
  min_volume_24h_usdt: 5000000
  symbol_refresh_interval_sec: 300
  min_spread_pct: 1.0
  maker_fee_pct: 0.1
  buffer_pct: 0.02
  order_size_usdt: 15
  price_offset_ticks: 1
  maker_only: true
  buy_timeout_sec: 3
  max_hold_sec: 6

  # PRO TIMEOUT PROTECTION (matching Kraken config)
  no_progress_timeout_sec: 3600      # ⏰ 1 hour - no progress timeout
  no_progress_min_loss_pct: 1.5      # 🎯 PRO: Only trigger if loss > 1.5%
  no_progress_atr_multiplier: 1.5    # 🎯 PRO: Require move > 1.5×ATR

  cooldown_after_trade_sec: 5
  cooldown_after_cancel_sec: 2
  cooldown_after_force_exit_sec: 10
  min_depth_usdt: 10000
  volatility_block_pct_30s: 0.3
  max_inventory_usdt: 200
  dust_threshold_base: 1.0e-08
  inventory_breach_cooldown_sec: 30
  min_cancel_interval_sec: 1
  order_refresh_time: 2
  rate_limit_buffer: 0.8
  log_level: INFO
  log_decisions: true
  log_block_reasons: true
  log_trade_summary: true
  log_metrics_interval_sec: 30
