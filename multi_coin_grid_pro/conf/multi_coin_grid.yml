# Multi-Coin Grid Trading Strategy Configuration
#
# This configuration file defines the parameters for the multi-coin grid trading strategy.
# The strategy automatically discovers and trades the best trending coins.

# Exchange Configuration
connector_name: kraken
quote_asset: EUR

# Coin Selection
max_coins_to_monitor: 20
min_24h_volume_eur: 250000  # Minimum €50k daily volume
exclude_expensive_coins: true  # Exclude BTC/ETH

# Trend Detection
trend_lookback_minutes: 60  # Track 60 minutes of price history
trend_min_change_pct: 0.5  # Minimum 0.5% trend to trade
price_update_interval: 30  # Update prices every 30 seconds

# Switch Management
min_switch_interval_seconds: 3600  # Minimum 1 hour between coin switches

# Grid Configuration
grid_range_pct_down: 3.0  # Place buy orders 3% below current price
grid_range_pct_up: 8.0  # Place sell orders 8% above current price
num_grids: 3  # Number of grid levels

# Capital Management
total_amount_quote: 100  # Total €100 per grid (testing with €100)
min_order_amount_quote: 10  # Minimum €10 per order

# Risk Management
stop_loss_pct: 0.08  # Stop loss at -8%
take_profit_pct: 0.02  # Take profit at +2% per grid level

# Order Management
max_open_orders: 5  # Maximum 5 open orders at once
order_frequency: 3  # Wait 3 seconds between order placements

blacklist:
  - CCD-EUR
  - FARTCOIN-EUR
  - 0G-EUR
  - 1INCH-EUR
  - 2Z-EUR
  - AB-EUR
  - ACA-EUR
  - USELESS-EUR
  - CC-EUR
