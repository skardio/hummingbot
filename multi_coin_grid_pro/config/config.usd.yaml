# ==============================================================================
# GRID CONFIGURATION (Hybrid Grid Engine)
# ==============================================================================

grid_range_pct_down: 1.5
grid_range_pct_up: 10.0           # 8 → 10: iets meer ruimte voor swings

num_grids: 7                      # 5 → 7: smoother fills

use_dynamic_grid_sizer: true

dynamic_grid_sizer:
  min_grids: 4                    # 3 → 4
  max_grids: 7                    # Keep at 7 for safety (€80/7 = €11.43/grid)
  low_vol_atr_pct: 0.7
  mid_vol_atr_pct: 2.0
  high_vol_atr_pct: 4.0

use_atr_grid_ranges: true
atr_multiplier_down: 1.5
atr_multiplier_up: 2.0

use_asymmetric_grids: true
smart_refill_threshold_pct: 3.0

# ==============================================================================
# TREND ENGINE (voor coin selectie)
# ==============================================================================

use_multi_timeframe: true
trend_lookback_short_minutes: 60
trend_lookback_mid_minutes: 240
trend_lookback_long_minutes: 1440

switch_threshold_percent: 3.0
exit_short_threshold: -1.5
exit_mid_threshold: -1.2

trend_min_entry_strength: 0.010    # OPTION B TEST: 1.0% (was 1.5%) - lower threshold for testing

# ==============================================================================
# COIN ROTATION & MONITORING
# ==============================================================================

coin_rotation_threshold: 180
price_update_interval: 30

# MAX MONITORING TIME: Als geen coin voldoet, roteer na X seconden
max_coin_monitoring_seconds: 300   # 5 minuten max per coin voordat volgende geprobeerd wordt
session_blacklist_duration_seconds: 7200  # 2 uur blacklist, dan weer proberen

# ==============================================================================
# CAPITAL & RISK MANAGEMENT (USD RESEARCH CONFIG)
# ==============================================================================

total_amount_quote: 85             # ~€80 * 1.08 = $86 → rounded to $85
min_order_amount_quote: 11         # ~€10 * 1.08 = $10.80 → $11

risk_reference_balance_quote: 110  # ~€100 * 1.08 = $108 → $110
risk_max_balance_per_trade_pct: 80
risk_max_total_open_risk_pct: 85

max_exposure_per_coin_pct: 25
max_total_exposure_pct: 60

stop_loss_pct: 0.05                # 5% globale SL per positie
take_profit_pct: 0.02              # 2% globale TP

min_grid_profit_pct: 2.0           # Verhoogd: 1.5 → 2.0 voor fee overhead ($0.04/trade)

emergency_exit_pct: -1.5
hard_stop_pct: -2.5

# ==============================================================================
# DRAWDOWN / KILL SWITCH (USD EQUIVALENT)
# ==============================================================================

max_daily_loss_pct: 3.0
max_weekly_loss_pct: 8.0
max_monthly_loss_pct: 12.0
max_daily_loss_usd: 32.0           # ~€30 * 1.08 = $32.40 → $32

# ==============================================================================
# TELEGRAM ALERTS (v2.0)
# ==============================================================================

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ==============================================================================
# ORDER MANAGEMENT
# ==============================================================================

max_open_orders: 5
order_frequency: 3
max_entry_spread_pct: 0.5

min_switch_interval_seconds: 1800   # 3600 → 1800: sneller roteren indien nodig
min_hold_time_seconds: 1200        # 1800 → 1200: niet té lang vastzitten

min_startup_wait_seconds: 90       # 60 → 90: net iets meer data voor eerste entry

smart_switch_k: 2.0
switch_cost_multiplier: 2.5
