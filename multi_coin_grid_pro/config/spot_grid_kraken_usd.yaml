# ==============================================================================
# GRID CONFIGURATION
# ==============================================================================

grid_range_pct_down: 4.0
grid_range_pct_up: 12.0

num_grids: 3                      # 🔧 FIX: 5→3 ($300/2=$150, 3 grids=$50/level — snelle fill)

use_dynamic_grid_sizer: true

dynamic_grid_sizer:
  min_grids: 3                    # 🔧 FIX: 4→3 (match num_grids)
  max_grids: 5                    # 🔧 FIX: 12→5 ($300 budget = max 5 small levels)
  low_vol_atr_pct: 0.7
  mid_vol_atr_pct: 2.0
  high_vol_atr_pct: 4.0

use_atr_grid_ranges: true
atr_multiplier_down: 1.5
atr_multiplier_up: 2.0

use_asymmetric_grids: true
smart_refill_threshold_pct: 3.0

# ==============================================================================
# TREND ENGINE
# ==============================================================================

use_multi_timeframe: true
trend_lookback_short_minutes: 60
trend_lookback_mid_minutes: 240
trend_lookback_long_minutes: 1440

switch_threshold_percent: 5.0         # 🔧 TUNED 2026-04-03: 3→5 (hogere bar voor switch, kosten moeten het waard zijn)
exit_short_threshold: -4.0
exit_mid_threshold: -3.0

trend_min_change_pct: 0.007
trend_min_entry_strength: 0.007

# ==============================================================================
# COIN ROTATION & MONITORING
# ==============================================================================

coin_rotation_threshold: 180
price_update_interval: 30

max_price_age_ms: 35000
max_orderbook_age_ms: 60000

max_coin_monitoring_seconds: 600     # T0-Q11: Was 180 (3 min) → 600 (10 min) - coins tijd geven
session_blacklist_duration_seconds: 7200

coin_discovery_refresh_interval_seconds: 3600

# ==============================================================================
# CAPITAL & RISK MANAGEMENT (USD - scaled appropriately)
# ==============================================================================
# 💡 $300 trading budget (van $1475 exchange balance: rest is long-term coins)
#    2 slots × $150/coin → 3 grid levels × $50/level
# ==============================================================================

max_simultaneous_coins: 2             # 🔧 FIX: 4→2 ($300/2=$150/coin, elimineert capital deadlock)

total_amount_quote: 300             # $300 USD budget (rest van $1475 is long-term investering)
min_order_amount_quote: 15          # $15 minimum order

risk_reference_balance_quote: 300   # 🔧 FIX: 400→300 (matcht actual trading budget)
risk_max_daily_loss_pct: 3           # T0-Q7: Was 30% ("TIJDELIJK" since 2025-02-14) → 3% real limit
risk_max_balance_per_trade_pct: 55   # 🔧 FIX: 60→55% ($300×55%=$165 max per trade)
risk_max_total_open_risk_pct: 95     # 🔧 FIX: 75→95% (2 slots gebruiken bijna heel budget)

max_exposure_per_coin_pct: 55        # 🔧 FIX: 80→55% (max $165/coin, 2 coins fit in $300)
max_total_exposure_pct: 95           # 🔧 FIX: 80→95% (met 2 slots mag bijna alles gebruikt worden)

switch_grace_period_seconds: 600      # 🔧 TUNED 2026-04-03: 180→600 (10 min grace, positie moet zich ontwikkelen)

# ==============================================================================
# PROFESSIONAL RISK MANAGEMENT
# ==============================================================================

use_professional_risk_mgmt: true

# T0-Q8: Stop-loss enabled (was null, unbounded losses until -12% emergency)
stop_loss_pct: 0.05                  # 5% stop-loss per positie
atr_stop_multiplier: 2.0
min_stop_pct: 0.02
max_stop_pct: 0.05

take_profit_pct: 0.05

# Trailing TP: lock in profit when price rises past activation, exit if it drops back by delta
trailing_stop_activation_pct: 0.02   # 🔧 TUNED 2026-04-02: 0.015→0.02 (trail only after 2%, more room to run)
trailing_stop_delta_pct: 0.005       # 🔧 TUNED 2026-04-02: 0.007→0.005 (tighter trail, lock in gains faster)

# Dynamic TP: scale take-profit with ATR (volatile coins get wider TP, quiet coins get tighter)
dynamic_tp_enabled: true
dynamic_tp_atr_multiplier: 0.35     # TP = ATR% × multiplier (e.g., 4% ATR × 0.35 = 1.4%)
dynamic_tp_min_pct: 0.020           # 🔧 TUNED 2026-04-03: 0.012→0.020 (floor 2.0%, net ~1.58% after 0.42% RT fees)
dynamic_tp_max_pct: 0.04            # 🔧 TUNED 2026-04-03: 0.03→0.04 (cap 4.0%, capture bigger moves in volatile coins)

time_based_stop_minutes: 360
time_stop_requires_stall: true
price_stall_threshold_atr: 0.3
min_minutes_since_last_fill: 45

min_rolling_pnl_pct: -0.02
min_win_rate_threshold: 0.35
pause_cooldown_minutes: 30             # 🔧 TUNED 2026-04-03: 120→30 (2h too long; caused death spiral with 641 blocks)
resume_min_pnl_pct: 0.0

min_grid_profit_pct: 2.0          # 🔧 TUNED 2026-04-03: 1.2→2.0 (must exceed 0.42% RT fees + margin; matches dynamic_tp_min_pct)

emergency_exit_pct: -5.0     # T0-Q9: Was -12%, nu -5% (4 coins × -5% = -20% vs -48% flash crash)
hard_stop_pct: -8.0           # T0-Q9: Was -15%, nu -8% (ultiem vangnet)

# ==============================================================================
# DRAWDOWN / KILL SWITCH
# ==============================================================================

max_daily_loss_pct: 3.0              # T0-Q7: Was 30% "TIJDELIJK" (13 maanden!) → 3% echte limiet
max_daily_loss_quote: 9.0           # 🔧 FIX: 120→9 (3% van $300 = $9 max dagverlies)
max_weekly_loss_pct: 7.0
max_monthly_loss_pct: 10.0

# ==============================================================================
# TELEGRAM ALERTS
# ==============================================================================

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ==============================================================================
# ORDER MANAGEMENT
# ==============================================================================

max_open_orders: 20               # 🔧 FIX: 60→20 (2 coins × 5 levels × 2 = 20 voldoende)
order_frequency: 3

min_switch_interval_seconds: 1800     # 🔧 TUNED 2026-04-03: 600→1800 (30 min cooldown, voorkom rapid-fire switches)
min_hold_time_seconds: 7200          # 🔧 TUNED 2026-04-03: 3600→7200 (2h - grid heeft tijd nodig voor fills)
max_hold_time_seconds: 21600      # 6h - align with hard_hold

# ==============================================================================
# TREND-AWARE EXIT SYSTEM (Soft/Hard Hold Time)
# ==============================================================================
# Prevents "dom verkopen" after fixed time when trend is still bullish
# After soft_hold: only exit if trend bearish OR pnl too negative
# After hard_hold: always exit (bag-holder prevention)
# ==============================================================================

soft_hold_time_seconds: 7200       # ⏰ 2 uur - trend-aware exit kicks in
hard_hold_time_seconds: 21600      # ⏰ 6 uur - always exit (bag-holder prevention)
soft_exit_min_trend_pct: 0.3       # 📈 Trend must be > 0.3% to extend hold
soft_exit_max_loss_pct: -1.0       # 🔧 TUNED 2026-04-02: -1.5→-1.0 (exit sooner when losing)
soft_exit_extend_seconds: 1800     # ⏳ Extend by 30 min if trend bullish

no_fill_timeout_sec: 3600            # T0-Q10: Was 1200 (20 min) → 3600 (60 min) - grid meer tijd geven
no_progress_timeout_sec: 3600    # 🔧 TUNED 2026-04-02: 5400→3600 (1 uur, cut stalled positions faster)
no_progress_min_loss_pct: 0.5    # 🔧 TUNED 2026-04-03: 1.0→0.5 (cut bags at -0.5%, halves NO_PROGRESS losses)
no_progress_atr_multiplier: 1.5
close_grace_sec: 120

min_startup_wait_seconds: 60

smart_switch_k: 2.0
switch_cost_multiplier: 3.5           # 🔧 TUNED 2026-04-03: 2.5→3.5 (straf switching zwaarder af, fees + spread zijn reëel)

# ==============================================================================
# DEBUG TRACE SYSTEM
# ==============================================================================

debug_trace_enabled: true
debug_trace_format: compact
debug_trace_log_accepted: false
debug_trace_log_rejected: true

# ==============================================================================
# OBSERVABILITY
# ==============================================================================

observability:
  structured_events_enabled: true
  events_output_dir: "logs/events_usd"  # 🔄 CHANGED: Separate events dir
  buffer_size: 100
  why_no_trade_report_enabled: true
  report_interval_seconds: 3600

# ==============================================================================
# DYNAMIC SLOT MANAGER
# ==============================================================================

dynamic_slots:
  enabled: true
  min_slots: 1
  max_slots: 3               # 🔧 FIX: 12→3 ($300 budget = max 2-3 coins)
  regime_multipliers:
    BULL: 1.5
    CHOP: 0.75
    BEAR: 0.25
