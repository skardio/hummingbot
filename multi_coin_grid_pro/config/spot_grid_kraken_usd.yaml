# ==============================================================================
# HYBRID GRID CONFIG v3.3 - USD VARIANT
# Kraken USD Multi-Coin Grid Bot (separate from EUR instance)
# Created: 2026-01-17
# ==============================================================================
# ⚠️ INSTANCE ISOLATION: This config runs INDEPENDENTLY from EUR bot
#    - Separate cooldowns DB: data/cooldowns_usd.db
#    - Separate logs: logs/logs_multi_coin_grid_usd_*.log
#    - Separate orders/state: no shared executors
# ==============================================================================

# INSTANCE IDENTIFIER - Used for DB path separation
instance_id: "usd"                  # 🔑 CRITICAL: Separates state from EUR bot


log_level: INFO
connector_name: kraken
quote_asset: USD                    # 🔄 CHANGED: EUR → USD
paper_trading: false                # 💰 LIVE TRADING MODE
auto_sell_orphaned_positions: true  # 🔧 2026-05-31: sell stranded coins on restart (capped at executor-tracked base)

# ==============================================================================
# DYNAMIC PAIR DISCOVERY (USD pairs)
# ==============================================================================

use_dynamic_pair_discovery: true
max_coins_to_monitor: 30                  # Was 25 → 30 (match met top_n voor orderbook prefetch)
min_24h_volume_quote: 500000          # Minimum 24h volume in quote currency (USD)

# US-007: Dynamic Pair Manager (two-tier discovery: REST scans all, WebSocket for best)
use_dynamic_pair_manager: true       # Enable two-tier pair discovery
pair_scan_interval_seconds: 300      # Interval between REST scans (5 min)
max_spread_pct: 0.5                  # Maximum bid-ask spread filter
exclude_expensive_coins: false

blacklist:
  # Stablecoins (no volatility)
  - USDT-USD
  - USDC-USD
  - DAI-USD
  - TUSD-USD
  - USDP-USD
  - GUSD-USD
  - PYUSD-USD
  # Wrapped/pegged assets
  - WBTC-USD
  - WETH-USD
  # Known problematic coins
  - MON-USD
  - CCD-USD
  - FARTCOIN-USD
  - GIGA-USD
  - XPL-USD
  - NIGHT-USD
  - AB-USD
  - XT-USD
  - EURC-USD
  - TRX-USD
  - PAXG-USD
  - SPX-USD
  - CH-USD
  - SAPIEN-USD
  - USELESS-USD
  # Structural SmartEntry failures (2026-04-29: 337× en 103× rejected, nooit door SmartEntry)
  - RLS-USD
  - BLEND-USD
  - PUMP-USD
  - WLFI-USD
  # NL-restricted coins (if applicable)
  - Q-USD
  - STBL-USD
  # Non-existent Kraken USD pairs (cause WebSocket errors)
  - AUT-USD
  - AUD-USD
  - ACU-USD
  - XNY-USD
  - CC-USD
  - ZRO-USD
  - XCN-USD
  - VIRTUAL-USD   # Stuck executor - causes infinite retry loop
  - AAVE-USD      # No orderbook data
  # HYPE-USD removed from blacklist 2026-05-25: grid loser due to trending, now momentum candidate
  - NEAR-USD      # No orderbook data
  - AXS-USD
  # Poor performers (2026-04-02 session review)
  - VVV-USD              # illiquid, gap-prone, -10.9% open bag
  - PTB-USD              # -2.56% margin, too illiquid for grid
  # Poor performers (2026-04-13 session: -$0.82 from SUI alone = 109% total loss)
  # SUI-USD removed from blacklist 2026-05-25: trends too hard for GRID but ideal momentum candidate
  # Catastrophic loss (2026-04-16: -$68.14 ALGO, bought but never sold = EARLY_STOP with 0 sells)
  - ALGO-USD             # Entire position stuck, close_type=8 with realized_sell=0
  # Zero-WR + type-8 orphan dominated losses (2026-05-31 analysis: 526 trades, -$493 netto)
  - PEPE-USD             # 9 trades, 0% WR, -$107 (3× FAILED orphan, sell=0)
  - UNI-USD              # 3 trades, 0% WR, -$77 (zombie_close deadlock → restart orphan)
  - ICP-USD              # 10 trades, 0% WR, -$44 (1× FAILED orphan, systematic loser)
  - 0G-USD               # 3 trades, -$67 (1× FAILED orphan, illiquid pair)
  - TON-USD              # 7 trades, 43% WR but -$74 all from 2× FAILED orphan; net negative
  - SOL-USD              # 29 trades, 3.4% WR, -$44 (systematic underperformer, 4× type-8)
  # Large-cap coins: not grid-trading targets + cause persistent batch update WARNINGs (no_price_in_batch)
  - ETH-USD              # Too expensive for grid, fails Kraken batch price API
  - LTC-USD              # Low volatility for grid, fails Kraken batch price API
  - ZEC-USD              # Low volatility for grid, fails Kraken batch price API
  - ELX-USD              # Structural SmartEntry fail: spread 1-4% (limit 0.5%) + ATR 11% (limit 7%)

# ==============================================================================
# ADAPTIVE REGIME DETECTION & FILTERS
# ==============================================================================

adaptive_regime_detection:
  enabled: true
  logging_only: false

  # V2-02: Require N consecutive identical detections before accepting a regime switch.
  # Prevents flicker. Higher = more stable, slower reaction. 1 = immediate (old behavior).
  regime_smoothing_count: 3

  # V2-06: Auto BEAR-light — allow 1 grid in shallow BEAR when score > threshold.
  # Safe default: disabled. Enable only after reviewing live BEAR regime behavior.
  bear_auto_light_enabled: true       # V2-06: BEAR-light active
  bear_auto_light_threshold: -5.0    # Score above this = shallow BEAR → allow 1 grid
  bear_size_multiplier: 0.5          # Position size fraction in BEAR-light (0.5 = 50%)

  bull_score_min: 5.0
  chop_score_min: -3.0
  bear_score_max: -3.0
  min_confidence: 0.65

  bull_min_duration_sec: 1800
  chop_min_duration_sec: 900
  bear_min_duration_sec: 1800
  hysteresis_buffer: 1.0

  log_regime_changes: true
  log_filter_updates: true

adaptive_filters:
  baseline:
    rsi_buy_min: 25.0
    rsi_buy_max: 72.0       # T3-F3: 68→72 (baseline omhoog, was #1 reject reason)
    rsi_extreme_min: 18.0
    vwap_max_deviation_pct: 12.0    # 🔧 TUNED 2026-04-03: 18→12 (stop adverse selection: coins te ver van VWAP zijn extended, niet mean-reversion)
    max_up_accel_pct: 5.0           # T3-F3: 4→5 (align met smart_entry_filter)
    max_down_accel_pct: -6.0        # T3-F3: -8→-6 (align met smart_entry_filter)
    atr_min_pct: 0.15       # 🔧 HF-01 2026-04-04: 1.5→0.15 (1.5% filterde ALLE coins, typische ATR 0.05-0.5%)
    atr_max_pct: 7.0
    spike_5m_max_pct: 4.0
    wick_ratio_min: 0.0
    grid_spacing_mult: 1.0
    max_active_grids: 2           # T2.6: 4→2 (match max_simultaneous_coins)
    entry_confidence_min: 0.60    # T3-F3: 0.65→0.60 (minder restrictief)

  BULL:
    rsi_buy_max: 76.0       # T3-F3: 72→76 (bull regime is ruimer)
    vwap_max_deviation_pct: 15.0    # 🔧 TUNED 2026-04-03: 20→15 (bull mag iets ruimer, maar niet 20%)
    max_up_accel_pct: 5.0           # T3-F3: 3→5
    max_down_accel_pct: -4.0
    atr_min_pct: 0.05       # 🔧 FIX: 0.08→0.05
    spike_5m_max_pct: 3.5
    max_trend_24h_pct: 25.0  # FIX 2026-05-01: pumps normaal in BULL (baseline=15)
    max_trend_4h_pct: 5.0    # FIX 2026-05-01: 4h rally OK in BULL (baseline=2.5)
    grid_spacing_mult: 1.2
    max_active_grids: 2           # T2.6: 6→2 (match budget)
    entry_confidence_min: 0.55    # T3-F3: 0.60→0.55

  CHOP:
    rsi_buy_max: 72.0       # T3-F3: 68→72 (was te restrictief, #1 reject)
    vwap_max_deviation_pct: 12.0    # T3-F3: 10→12 (iets ruimer)
    max_up_accel_pct: 2.5           # T3-F3: 1.8→2.5 (iets ruimer)
    max_down_accel_pct: -3.0        # T3-F3: -2.5→-3.0 (iets ruimer)
    atr_min_pct: 0.06       # 🔧 FIX: 0.10→0.06 (was too restrictive in quiet markets)
    spike_5m_max_pct: 2.5
    max_trend_24h_pct: 15.0  # FIX 2026-05-01: baseline waarde (ranging market)
    max_trend_4h_pct: 2.5    # FIX 2026-05-01: baseline waarde
    grid_spacing_mult: 0.8
    max_active_grids: 2           # T2.6: 3→2 (match budget)
    entry_confidence_min: 0.65    # T3-F3: 0.75→0.65 (te hoog, blokkeerde te veel)

  BEAR:
    rsi_buy_max: 66.0       # T3-F3: 62→66 (iets ruimer voor mean-reversion)
    vwap_max_deviation_pct: 10.0    # T3-F3: 8→10 (iets ruimer)
    max_up_accel_pct: 2.0           # T3-F3: 1.5→2.0
    max_down_accel_pct: -3.0        # T3-F3: -2.0→-3.0 (ruimer voor dips)
    atr_min_pct: 0.08       # 🔧 FIX: 0.15→0.08 (still allow some trades)
    spike_5m_max_pct: 2.0
    max_trend_24h_pct: 10.0  # FIX 2026-05-01: strenger in BEAR (al 10% up = extended)
    max_trend_4h_pct: 2.0    # FIX 2026-05-01: strenger in BEAR
    grid_spacing_mult: 1.5
    max_active_grids: 1             # 🔧 FIX: 0→1 (allow 1 grid for mean-reversion)
    entry_confidence_min: 0.80    # T3-F3: 0.90→0.80
    bear_allow_meanrev: false    # 🔧 2026-05-20: true→false (bear_auto_light_enabled=true is de actieve BEAR-gate; score-gebaseerd ipv binaire override)

# ==============================================================================
# GRID SUITABILITY SCORER (Per-Coin Mean-Reversion Fitness)
# ==============================================================================
# Scores each coin on how well it suits grid (mean-reversion) trading.
# Trending coins score low, choppy/bouncy coins score high.
# Modes: logging_only=true (log but don't filter) or false (actively filter).

grid_suitability:
  enabled: true
  logging_only: false            # ACTIVE mode — filters coins below threshold
  min_grid_score: 0.50           # 0-1 threshold (was 0.30, raised after 13h data)
  lookback_candles: 48           # 48 × 5min = 4 hours of data
  range_efficiency_max: 0.70     # Max acceptable range efficiency

# ==============================================================================
# COIN PROFILES & SMART ENTRY (USD pairs)
# ==============================================================================

manual_trading_pairs: []  # Dynamic discovery mode

# ==============================================================================
# MULTI-TIMEFRAME BUY PROTECTION
# ==============================================================================

use_multi_timeframe_buy: true
mtf_1h_min_pct: -2.0              # 🔧 FIX: 0→-2 (allow -2% pullback)
mtf_4h_min_pct: -1.5              # 🔧 FIX: 0→-1.5 (allow -1.5% pullback)
mtf_24h_min_pct: -2.5
mtf_declining_1h_max: -4.0
mtf_declining_4h_max: -2.0

# ==============================================================================
# WARMUP TREND OVERRIDE
# ==============================================================================

warmup_override_enabled: true
warmup_4h_strong_min: -0.5
warmup_1h_min_if_4h_strong: -1.5
warmup_max_minutes: 120

# ==============================================================================
# FEATURE 1.1: MARKET REGIME FILTER - BTC Trend Following
# ==============================================================================

market_regime:
  enabled: true
  btc_symbol: "BTC-USD"             # 🔄 CHANGED: BTC-EUR → BTC-USD

  btc_trend_1h_min_pct: -2.0
  btc_trend_4h_min_pct: 0.0
  btc_trend_24h_min_pct: -5.0

  dump_threshold_pct: -5.0
  dump_pause_minutes: 60

  altcoin_breadth_min_pct: 30.0
  altcoin_breadth_sample_pairs:     # 🔄 CHANGED: USD pairs
    - ETH-USD
    - SOL-USD
    - BNB-USD
    - AVAX-USD
    - LINK-USD

  recovery_threshold_pct: 2.0

# ==============================================================================
# FEATURE 1.2: TIME-BASED TRADING RULES
# ==============================================================================

time_based_rules:
  enabled: false

  low_liquidity_hours: [0, 1, 2]
  low_liquidity_action: "monitor_only"

  high_liquidity_hours: [13, 14, 15, 16, 17, 18]
  high_liquidity_bonus_pct: 10.0

  max_total_size_multiplier: 1.2

  weekend_trading_enabled: true
  weekend_risk_multiplier: 0.5

  low_liquidity_overrides_weekend: true

  holidays: ["2025-12-25", "2026-01-01"]
  holiday_action: "reduce_size"
  holiday_risk_multiplier: 0.5

# ==============================================================================
# FEATURE 1.2b: LIQUIDITY-AWARE SMART SIZING
# ==============================================================================

liquidity_aware_sizing:
  enabled: true

  sizing_priority: ["low_liquidity", "holiday", "weekend", "time_bonus", "regime_bonus", "volatility_bonus"]
  base_size_calculation: "capital_pct_daily"

  cumulative_check_enabled: true
  cumulative_log_level: "WARNING"

  time_bonus_scalar:
    high_liquidity: 1.10
    normal_hours: 1.00
    low_liquidity: 0.70

  regime_bonus_scalar:
    strong_bull: 1.15
    neutral: 1.00
    weak_bear: 0.60

  volatility_bonus_scalar:
    high_vol: 0.85
    normal_vol: 1.00
    low_vol: 1.10

  max_cumulative_multiplier: 1.20

  log_sizing_calc: true
  log_format: "JSON"

# ==============================================================================
# FEATURE 1.3: PERFORMANCE TRACKING
# ==============================================================================

performance_tracking:
  enabled: true

  min_win_rate_pct: 45.0
  min_profit_factor: 1.2
  min_sharpe_ratio: 0.5
  max_drawdown_pct: 5.0

  lookback_trades: 20
  lookback_days: 7

  report_interval_hours: 4
  save_to_database: true

  track_per_symbol: true
  min_trades_per_symbol: 3

# ==============================================================================
# ORDERBOOK DEPTH-BASED LIQUIDITY PROXY
# ==============================================================================

orderbook_liquidity:
  enabled: true
  mode: live
  regime_aware: true
  depth_pct_range: 0.5
  depth_levels: 10
  min_depth_multiplier: 5.0
  use_for_ranking: true
  use_for_entry: true
  log_depth_metrics: true

# ==============================================================================
# ORDERBOOK PREFETCH
# ==============================================================================

orderbook_prefetch:
  enabled: true
  mode: live
  top_n: 30                          # Was 15 → 30 (moet >= max_coins_to_monitor zijn!)
  max_subscriptions_per_minute: 20

# ==============================================================================
# SMART ENTRY FILTER v2
# ==============================================================================

use_smart_entry_filter: true

smart_entry_filter:
  rsi_buy_max: 65.0              # 🔧 RE-02 2026-04-27: 60→65 (claim niet statistisch onderbouwd, n=13)
  rsi_extreme_low: 18.0
  rsi_block_min: 85.0

  vwap_max_deviation_pct: 12.0      # 🔧 TUNED 2026-04-03: 18→12 (align met adaptive baseline, stop adverse selection)
  min_wick_ratio: 0.0

  max_atr_pct_for_grid: 7.0
  min_atr_pct_for_grid: 0.15        # 🔧 2026-04-29: 0.30→0.15 fallback (regime override: BULL=0.05, CHOP=0.06, BEAR=0.08 via adaptive_filters)

  max_5m_spike_pct: 4.0
  max_down_accel_pct: -6.0         # T3-F3: -8→-6 (iets strikter falling knife)
  max_up_accel_pct: 5.0            # T3-F3: 4→5 (12% rejects waren blow-off accel)

  max_trend_4h_pct: 2.5            # 🔧 RE-01 2026-04: NEW (4h trend >1.2% = 4× worse PnL, cap at 2.5%)
  max_trend_24h_pct: 15.0          # 🔧 TUNED 2026-04-03: 25→15 (stop trend-chasing: coins +25% in 24h zijn geen grid-candidates)
  min_trend_24h_pct: -10.0

  max_entry_spread_pct: 0.5        # T3-F3: 0.3→0.5 (25% rejects, Kraken spreads 0.3-0.6%)
  slippage_check_enabled: true

  min_depth_multiplier: 5.0
  depth_check_enabled: true

  # EPIC v3.4: MOMENTUM HEALTH GUARDS
  vwap_slope_guard_enabled: true
  vwap_slope_guard_shadow_mode: false
  vwap_slope_dual_confirmation: true

  parabolic_detector_enabled: true
  parabolic_detector_shadow_mode: false
  parabolic_cooldown_minutes: 60
  parabolic_cooldown_persist: true

  market_exhaustion_enabled: true
  market_exhaustion_threshold_pct: 0.70
  market_exhaustion_sample_size: 10
  market_exhaustion_cooldown_min: 30
  market_exhaustion_telegram: true

  momentum_thresholds:
    baseline:
      slope_min_pct_5m: 0.05
      slope_min_pct_15m: 0.02
      slope_max_pct_15m: 0.30
      dev_max_pct: 5.0
      accel_5m_min_pct: 1.0
      accel_5m_max_pct: 5.0
      accel_15m_max_pct: 8.0

    regimes:
