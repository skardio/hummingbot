# ==============================================================================
# GRID CONFIGURATION
# ==============================================================================

grid_range_pct_down: 4.0
grid_range_pct_up: 12.0

num_grids: 3                      # 🔧 FIX: 5→3 ($300/2=$150, 3 grids=$50/level — snelle fill)
min_grid_level_spacing_pct: 0.80  # 🔧 US12 2026-05-22: 0.60→0.80 (worst_case RT fee 0.42%; 0.80 geeft 0.38% marge, veilig bij taker fill)

use_dynamic_grid_sizer: true

dynamic_grid_sizer:
  min_grids: 3                    # 🔧 FIX: 4→3 (match num_grids)
  max_grids: 5                    # 🔧 FIX: 12→5 ($300 budget = max 5 small levels)
  low_vol_atr_pct: 0.7
  mid_vol_atr_pct: 2.0
  high_vol_atr_pct: 4.0

use_atr_grid_ranges: true
atr_multiplier_down: 1.5
atr_multiplier_up: 2.0

use_asymmetric_grids: true
smart_refill_threshold_pct: 3.0

# ==============================================================================
# TREND ENGINE
# ==============================================================================

use_multi_timeframe: true
trend_lookback_short_minutes: 60
trend_lookback_mid_minutes: 240
trend_lookback_long_minutes: 1440

switch_threshold_percent: 5.0         # 🔧 TUNED 2026-04-03: 3→5 (hogere bar voor switch, kosten moeten het waard zijn)
exit_short_threshold: -4.0
exit_mid_threshold: -3.0

trend_min_change_pct: 0.007
trend_min_entry_strength: 0.007

# ==============================================================================
# COIN ROTATION & MONITORING
# ==============================================================================

coin_rotation_threshold: 180
pool_membership_cooldown_seconds: 1800  # ST-03: 30 min cooldown voordat coin uit pool mag (voorkom 29× in/uit flipping)
price_update_interval: 30

max_price_age_ms: 35000
max_orderbook_age_ms: 60000

max_coin_monitoring_seconds: 600     # T0-Q11: Was 180 (3 min) → 600 (10 min) - coins tijd geven
session_blacklist_duration_seconds: 7200

coin_discovery_refresh_interval_seconds: 3600

# ==============================================================================
# CAPITAL & RISK MANAGEMENT (USD - scaled appropriately)
# ==============================================================================
# 💡 $300 trading budget (van $1475 exchange balance: rest is long-term coins)
#    2 slots × $150/coin → 3 grid levels × $50/level
# ==============================================================================

max_simultaneous_coins: 3             # Aligned met dynamic_slots.max_slots: 3 (CHOP=2, BULL=3)
                                      # 🔧 US9: Verlaging naar 2 zodra edge bewezen is (→$150/coin)

total_amount_quote: 300             # Origineel: $300 USD budget
                                    # 🔧 US9: Verlaging naar 200 zodra edge bewezen is (→$100/coin bij 2 slots)
min_order_amount_quote: 15          # $15 minimum order

risk_reference_balance_quote: 300   # Origineel: $300 referentiebalans
risk_bucket_limits:                 # Max % van portfolio per bucket (optioneel; weglaten = module defaults)
  L1: 10.0                          # BTC/ETH -- zelden gehandeld, klein houden
  L2: 60.0                          # Origineel
  MEME: 30.0                        # Origineel
  ILLIQUID: 60.0                    # Max 60% in illiquid
  BLOCKED: 0.0                      # Nooit handelen
risk_max_daily_loss_pct: 3           # T0-Q7: Was 30% ("TIJDELIJK" since 2025-02-14) → 3% real limit
risk_max_balance_per_trade_pct: 55   # Origineel
risk_max_total_open_risk_pct: 95     # Origineel

max_exposure_per_coin_pct: 55        # Origineel
max_total_exposure_pct: 95           # Origineel

switch_grace_period_seconds: 600      # 🔧 TUNED 2026-04-03: 180→600 (10 min grace, positie moet zich ontwikkelen)

# ==============================================================================
# PROFESSIONAL RISK MANAGEMENT
# ==============================================================================

use_professional_risk_mgmt: true

# T0-Q8: Stop-loss enabled (was null, unbounded losses until -12% emergency)
stop_loss_pct: 0.015                 # 🔧 TUNED 2026-05-22: 3%→1.5% (XDC-USD run: -2.9% dodged 3% stop, still lost -$1.72)
atr_stop_multiplier: 1.5            # 🔧 TUNED 2026-04-14: 2.0→1.5 (tighter ATR stop, sneller sluiten)
min_stop_pct: 0.010                  # 🔧 TUNED 2026-05-22: 1.5%→1.0% (tighter floor, aligned with new stop_loss_pct)
max_stop_pct: 0.020                   # 🔧 TUNED 2026-05-22: 3%→2.0% (cap aligned with new stop_loss_pct)

take_profit_pct: 0.05

# Item 7: Dynamic TP op basis van trendsterkte (0.70x–1.50x basis-TP)
use_dynamic_take_profit: true
min_take_profit_pct: 0.020         # Floor: 2.0%
max_take_profit_pct: 0.08          # Ceiling: 8%

# Item 4: Daily coin kill switch (-1R = halve size, -2R = disable voor vandaag)
daily_kill_switch_enabled: true
r_unit_quote: 5.0                  # 1R = $5

# Item 16: Kapitaalreserve voor beste setups
capital_reserve_pct: 10.0         # 10% achtergehouden voor hoge-kwaliteit entries

# Trailing TP: lock in profit when price rises past activation, exit if it drops back by delta.
# 2026-05-07: global TAKE_PROFIT now requires real fee-aware net target first; trailing can wake earlier
# without the old "tiny positive TP close" problem. Keep delta wider than old 0.5% noise setting.
trailing_stop_activation_pct: 0.015   # Activeer bij +1.5% net/open P&L zodat winnaars eerder tracked worden
trailing_stop_delta_pct: 0.010        # 1.0% pullback buffer; fee-aware guard still blocks below break-even

# Dynamic TP: scale take-profit with ATR (volatile coins get wider TP, quiet coins get tighter)
dynamic_tp_enabled: true
dynamic_tp_atr_multiplier: 0.60     # 🔧 2026-05-31: 0.35→0.60 (0.35 gaf altijd 2% floor; bij ATR 4% nu 2.4%, bij 6% = 3.6%)
dynamic_tp_min_pct: 0.025           # 🔧 2026-05-31: 0.020→0.025 (Kraken fees 0.55% RT → 2.5% floor geeft 1.95% netto)
dynamic_tp_max_pct: 0.05            # 🔧 2026-05-31: 0.04→0.05 (match take_profit_pct ceiling)

time_based_stop_minutes: 360
time_stop_requires_stall: true
price_stall_threshold_atr: 0.3
min_minutes_since_last_fill: 45

min_rolling_pnl_pct: -0.02
min_win_rate_threshold: 0.35
pause_cooldown_minutes: 30             # 🔧 TUNED 2026-04-03: 120→30 (2h too long; caused death spiral with 641 blocks)
resume_min_pnl_pct: 0.0

min_grid_profit_pct: 2.0          # 🔧 TUNED 2026-04-03: 1.2→2.0 (must exceed 0.42% RT fees + margin; matches dynamic_tp_min_pct)

emergency_exit_pct: -3.0     # 🔧 TUNED 2026-04-14: -5%→-3% (bij $5 grid = max -$0.15 verlies, aligned met 3% stop_loss)
hard_stop_pct: -5.0           # 🔧 TUNED 2026-04-14: -8%→-5% (smaller grids need tighter safety net)

# ==============================================================================
# DRAWDOWN / KILL SWITCH
# ==============================================================================

max_daily_loss_pct: 3.0              # T0-Q7: Was 30% "TIJDELIJK" (13 maanden!) → 3% echte limiet
max_daily_loss_quote: 9.0           # 🔧 FIX: 120→9 (3% van $300 = $9 max dagverlies)
max_weekly_loss_pct: 7.0
max_monthly_loss_pct: 10.0

# ==============================================================================
# TELEGRAM ALERTS
# ==============================================================================

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ==============================================================================
# ORDER MANAGEMENT
# ==============================================================================

max_open_orders: 20               # 🔧 FIX: 60→20 (2 coins × 5 levels × 2 = 20 voldoende)
order_frequency: 3

min_switch_interval_seconds: 1800     # 🔧 TUNED 2026-04-03: 600→1800 (30 min cooldown, voorkom rapid-fire switches)
min_hold_time_seconds: 2700          # 🔧 TUNED 2026-04-14: 7200→2700 (45 min - data toont sweet spot 5-30m, >1h verliesgevend)
max_hold_time_seconds: 5400          # 🔧 TUNED 2026-04-14: 21600→5400 (90 min hard cap - 2-6h bucket was -$0.40)

# ==============================================================================
# TREND-AWARE EXIT SYSTEM (Soft/Hard Hold Time)
# ==============================================================================
# Prevents "dom verkopen" after fixed time when trend is still bullish
# After soft_hold: only exit if trend bearish OR pnl too negative
# After hard_hold: always exit (bag-holder prevention)
# ==============================================================================

soft_hold_time_seconds: 2700       # 🔧 TUNED 2026-04-14: 7200→2700 (45 min - aligned with sweet spot)
hard_hold_time_seconds: 5400       # 🔧 TUNED 2026-04-14: 21600→5400 (90 min - trades >1h zijn verliesgevend)
soft_exit_min_trend_pct: 0.3       # 📈 Trend must be > 0.3% to extend hold
soft_exit_max_loss_pct: -0.5       # 🔧 TUNED 2026-04-14: -1.0→-0.5 (exit eerder bij verlies, kleine grids)
soft_exit_extend_seconds: 900      # 🔧 TUNED 2026-04-14: 1800→900 (15 min extend ipv 30, sneller roteren)

no_fill_timeout_sec: 1800            # 🔧 TUNED 2026-04-14: 3600→1800 (30 min - geen fills = dode liquiditeit, cut sneller)
no_progress_timeout_sec: 2700    # 🔧 TUNED 2026-04-14: 3600→2700 (45 min - aligned met soft_hold sweet spot)
fee_aware_timeout_bypass_sec: 3600   # 🔧 NEW 2026-05-22: after 60 min the fee-aware guard is lifted (US2)
                                     #    Rationale: no_progress fires at 45 min, fee-guard may block it;
                                     #    after 60 min capital efficiency > fee optimisation (max_hold=90 min)
no_progress_min_loss_pct: 0.5    # 🔧 TUNED 2026-04-03: 1.0→0.5 (cut bags at -0.5%, halves NO_PROGRESS losses)
no_progress_atr_multiplier: 1.5
close_grace_sec: 600               # ST-05b: 120→600 (10 min graceful LIMIT orders before aggressive market exit)
coerce_tp_to_step: true            # Zorg dat TP >= 1 grid-stap (nodig voor coarse step-size exchanges zoals Kraken INJ)

min_startup_wait_seconds: 60

smart_switch_k: 2.0
switch_cost_multiplier: 3.5           # 🔧 TUNED 2026-04-03: 2.5→3.5 (straf switching zwaarder af, fees + spread zijn reëel)

# ==============================================================================
# DEBUG TRACE SYSTEM
# ==============================================================================

debug_trace_enabled: true
debug_trace_format: compact
debug_trace_log_accepted: false
debug_trace_log_rejected: true

# ==============================================================================
# OBSERVABILITY
# ==============================================================================

observability:
  structured_events_enabled: true
  events_output_dir: "logs/events_usd"  # 🔄 CHANGED: Separate events dir
  buffer_size: 100
  why_no_trade_report_enabled: true
  report_interval_seconds: 3600

# ==============================================================================
# DYNAMIC SLOT MANAGER
# ==============================================================================

dynamic_slots:
  enabled: true
  min_slots: 1
  max_slots: 3               # 🔧 FIX: 12→3 ($300 budget = max 2-3 coins)
  regime_multipliers:
    BULL: 1.5
    CHOP: 0.75
    BEAR: 0.25

# ==============================================================================
# REGIME-FIRST COIN SELECTION
# ==============================================================================

regime_coin_selection:
  bear_allow_trading: false       # Sit out in BEAR regime
  bear_max_grids: 0
  chop_use_grid_ranking: true     # CHOP: rank by grid suitability
  chop_min_trend_pct: 0.001      # Near-zero floor: accept flat/sideways coins
  chop_max_trend_pct: 3.0        # >3% |trend| = too trendy for grid
  bull_use_grid_ranking: false    # BULL: rank by trend strength

# ==============================================================================
# FEE-AWARE FILTER
# ==============================================================================

fee_aware_filter:
  enabled: true
  taker_fee_pct: 0.35            # 🔧 FIX 2026-05-01: 0.26→0.35 (observed taker fee at <$10k/30d volume tier)
  maker_fee_pct: 0.20            # 🔧 FIX 2026-05-01: 0.16→0.20 (observed maker fee at <$10k/30d volume tier)
  fee_model: best_case           # Grid orders use LIMIT_MAKER (post-only) → gegarandeerd maker; maker+maker=0.40% RT
  min_net_profit_pct: 0.3        # Min expected profit after fees
  # V2-04: Expected-Fill Hourly Profit Model
  hourly_profit_check_enabled: false  # false = shadow mode (logs only), true = blocks entry
  min_profit_per_hour_pct: 0.05       # Min expected profit per hour as % of capital per level
  fills_calibration_factor: 1.0       # Tunable: fills/h = (atr/spacing) × factor

# ==============================================================================
# ST-11: IDLE MODE
# Reduces scan frequency when no trading edge is found, saving resources.
# ==============================================================================

idle_mode:
  enabled: true
  no_edge_cycles_to_idle: 10     # Cycles with no edge before entering idle
  idle_scan_interval_seconds: 120  # Seconds between scans in idle mode
  normal_scan_interval_seconds: 10  # Normal scan interval (reference only)
  log_interval_cycles: 5         # Log idle status every N cycles

# ==============================================================================
# ST-12: ECONOMIC EDGE GATE
# Blocks grid creation when expected profit per level is too thin.
# ==============================================================================

economic_edge_gate:
  enabled: true
  min_edge_pct: 0.10             # Min expected edge after all costs
  include_spread_cost: false     # 🔧 FIX 2026-05-02: disabled (spread cost was 0.275% extra; total now 0.60% vs 1.10%)
  include_slippage_buffer_pct: 0.05  # Slippage buffer to subtract

# ==============================================================================
# US1: PER-CONNECTOR FEE + EDGE OVERRIDES
# Allows fine-tuning fee model and min edge per exchange without changing globals.
# Values here merge on top of the global fee_aware_filter / economic_edge_gate.
# ==============================================================================

connector_overrides:
  kraken_spot:
    fee_aware_filter:
      taker_fee_pct: 0.35        # Kraken USD taker fee at <$10k/30d volume
      maker_fee_pct: 0.20        # Kraken USD maker fee
      fee_model: best_case       # LIMIT_MAKER (post-only) on Kraken → gegarandeerd maker fills
    economic_edge_gate:
      min_edge_pct: 0.10         # 🔧 US1: raise to 0.25 if fees increase or spread widens
      include_spread_cost: false
      include_slippage_buffer_pct: 0.05
    min_grid_level_spacing_pct: 0.80  # 🔧 US12 2026-05-22: 0.60→0.80 (fee-realistisch; zie US12)

# ==============================================================================
# ENHANCED CLOSE COOLDOWNS
# ==============================================================================

close_cooldowns:
  failed_sec: 21600              # 6h cooldown after FAILED
  early_stop_sec: 10800          # 3h cooldown after EARLY_STOP
  stop_loss_sec: 21600           # 🔧 US15 2026-05-22: 6h cooldown after STOP_LOSS (markt sloeg hard terug)
  no_progress_sec: 3600          # 1h cooldown after timeout
  take_profit_sec: 7200          # 2h cooldown after TAKE_PROFIT (prevents re-entry trap)
  loss_streak_multiplier: 1.5    # Escalate cooldown per consecutive loss
  max_streak_before_blacklist: 2  # 🔧 US11 2026-05-22: 3→2 (2 opeenvolgende verliezen = voldoende bewijs)

# ==============================================================================
# US13: ATR-FEE GATE
# Blocks entry when ATR is too low to cover roundtrip fees.
# Kraken taker=0.35% maker=0.20% → average RT fee=0.55% → required ATR=1.10% (2.0×)
# ==============================================================================
atr_fee_gate:
  enabled: true
  min_atr_fee_multiplier: 2.0   # ATR must be >= 2× roundtrip fee
  # fee_model/taker_fee_pct/maker_fee_pct read from fee_aware_filter (connector_overrides)

# ==============================================================================
# ATR COIN SELECTION
# prefilter_ratio=0.75 → soft threshold = 1.10% × 0.75 = 0.825%
# ==============================================================================
atr_coin_selection:
  enabled: true
  prefilter_ratio: 0.50         # soft threshold = required_atr × ratio (1.10% × 0.50 = 0.55%)
  use_as_ranking_signal: true

# ==============================================================================
# US16: RE-ENTRY PRICE GUARD
# Blocks re-entry when current price has dropped significantly since last exit.
# ==============================================================================
reentry_price_guard:
  enabled: true
  max_drop_below_last_exit_pct: 0.50  # Block if price dropped > 0.50% vs last exit mid-price
  apply_after_close_types:
    - TAKE_PROFIT
    - STOP_LOSS
    - EARLY_STOP

# ==============================================================================
# REGIME-BASED TIMEOUTS
# ==============================================================================

regime_timeouts:
  bull_no_progress_sec: 7200     # 2h - trending coins need time
  chop_no_progress_sec: 5400     # 1.5h - should bounce within window
  bear_no_progress_sec: 3600     # 1h - faster cuts in bear
  bull_no_fill_sec: 5400         # 1.5h
  chop_no_fill_sec: 3600         # 1h
  bear_no_fill_sec: 2400         # 40m

# ==============================================================================
# MOMENTUM SLEEVE (Fase 2 — detect-only, geen orders)
# ==============================================================================

momentum_sleeve:
  mode: paper                           # detect_only | paper | live
  enabled: true
  # --- paper/live trading params eersttest met source ~/.venvs/bot/bin/activate && python analyze_momentum_paper.py --since 1000 ---
  max_positions: 1
  max_quote_per_position: 25
  min_score: 75
  stop_loss_pct: 0.012
  take_profit_pct: 0.020
  trailing_activation_pct: 0.012
  trailing_distance_pct: 0.008
  max_hold_minutes: 90
  cooldown_minutes: 60
  summary_interval_minutes: 60
  # --- scoring gate params (used by MomentumCandidateScorer) ---
  min_score_to_enter: 55
  momentum_1h_min_pct: 0.5
  momentum_4h_min_pct: 1.0
  momentum_max_rsi: 80
  momentum_min_volume_expansion: 1.0   # Verlaagd van 1.2 → 1.0: in CHOP is volume flat, niet uitbreidend
  momentum_regime_gate:
    - BULL
    - CHOP
  momentum_max_spread_pct: 0.5
  momentum_max_wick_risk: 0.7
  rejected_log_throttle_seconds: 300
  scorer_weights:
    trend_1h: 0.25
    trend_4h: 0.30
    volume_expansion: 0.20
    relative_strength: 0.15
    spread: 0.05
    rsi_wick_risk: 0.05
