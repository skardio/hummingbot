# ==============================================================================
# ADAPTIVE REGIME DETECTION & FILTERS (Phase 2: Active)
# ==============================================================================

adaptive_regime_detection:
  enabled: true                    # Enable regime detection
  logging_only: false              # PHASE 2: Apply adaptive filters based on regime

  # Regime classification thresholds
  bull_score_min: 5.0              # Score >= 5 → BULL
  chop_score_min: -3.0             # Score in [-3, 5] → CHOP
  bear_score_max: -3.0             # Score < -3 → BEAR
  min_confidence: 0.65             # Minimum confidence to classify

  # Hysteresis settings (prevent flip-flopping)
  bull_min_duration_sec: 1800      # 30 min minimum in BULL
  chop_min_duration_sec: 900       # 15 min minimum in CHOP
  bear_min_duration_sec: 1800      # 30 min minimum in BEAR
  hysteresis_buffer: 1.0           # Score buffer for regime exit

  # Logging
  log_regime_changes: true
  log_filter_updates: true

adaptive_filters:
  # Baseline filters (conservative, used as fallback)
  baseline:
    rsi_buy_min: 25.0
    rsi_buy_max: 80.0               # 🔧 FIX: 71→80 (allow trading in CHOP/BEAR when altcoins pumping)
    rsi_extreme_min: 20.0
    vwap_max_deviation_pct: 5.0     # 🔧 FIX: 3.0→5.0 (allow stronger altcoin moves)
    max_up_accel_pct: 2.0           # 🔧 FIX: 1.2→2.0 (allow momentum)
    max_down_accel_pct: -3.0        # 🔧 FIX: -2.0→-3.0 (allow deeper pullbacks)
    atr_min_pct: 0.10               # 🔧 FIX: 0.15→0.10 (Kraken EUR pairs less volatile than USDT)
    atr_max_pct: 6.0
    spike_5m_max_pct: 2.5           # 🔧 FIX: 2.0→2.5 (allow bigger moves)
    wick_ratio_min: 0.0
    grid_spacing_mult: 1.0
    max_active_grids: 1
    entry_confidence_min: 0.70

  # BULL regime: relaxed filters
  BULL:
    rsi_buy_max: 85.0
    vwap_max_deviation_pct: 7.0
    max_up_accel_pct: 3.0
    max_down_accel_pct: -4.0
    atr_min_pct: 0.08
    spike_5m_max_pct: 3.5
    grid_spacing_mult: 1.2
    max_active_grids: 3
    entry_confidence_min: 0.60

  # CHOP regime: strict filters
  CHOP:
    rsi_buy_max: 78.0               # 🔧 FIX: 71→78 (allow trading in choppy markets)
    vwap_max_deviation_pct: 4.5     # 🔧 FIX: 3.0→4.5 (more room for altcoin moves)
    max_up_accel_pct: 1.8           # 🔧 FIX: 1.2→1.8 (allow some momentum)
    max_down_accel_pct: -2.5        # 🔧 FIX: -2.0→-2.5 (allow pullbacks)
    atr_min_pct: 0.10               # 🔧 FIX: 0.15→0.10 (Kraken EUR pairs)
    spike_5m_max_pct: 2.5           # 🔧 FIX: 2.0→2.5
    grid_spacing_mult: 0.8
    max_active_grids: 1
    entry_confidence_min: 0.75

  # BEAR regime: ultra-strict or disabled
  BEAR:
    rsi_buy_max: 70.0               # 🔧 FIX: 50→70 (allow counter-trend altcoin pumps)
    vwap_max_deviation_pct: 3.5     # 🔧 FIX: 1.5→3.5 (allow mean-reversion trades)
    max_up_accel_pct: 1.5           # 🔧 FIX: 0.5→1.5 (allow counter-trend momentum)
    max_down_accel_pct: -2.0        # 🔧 FIX: -1.0→-2.0 (allow pullbacks)
    atr_min_pct: 0.15
    spike_5m_max_pct: 2.0           # 🔧 FIX: 1.0→2.0 (allow bigger moves)
    grid_spacing_mult: 1.5
    max_active_grids: 1             # 🔧 FIX: 0→1 (allow 1 grid even in BEAR)
    entry_confidence_min: 0.80      # 🔧 FIX: 0.90→0.80 (slightly relaxed)
    bear_allow_meanrev: true        # 🔧 FIX: false→true (allow counter-trend trades)

