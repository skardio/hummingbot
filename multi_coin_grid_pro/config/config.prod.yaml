stop_loss_pct: 0.05                # 5% globale SL per positie
take_profit_pct: 0.02              # 2% globale TP

min_grid_profit_pct: 2.0           # Verhoogd: 1.5 → 2.0 voor fee overhead (€0.04/trade)

emergency_exit_pct: -3.0           # 3% emergency exit (was -1.5%, te strict)
hard_stop_pct: -5.0                # 5% hard stop (was -2.5%, te strict)

# ==============================================================================
# DRAWDOWN / KILL SWITCH
# ==============================================================================

max_daily_loss_pct: 3.0
max_weekly_loss_pct: 8.0
max_monthly_loss_pct: 12.0
max_daily_loss_eur: 30.0

# ==============================================================================
# TELEGRAM ALERTS (v2.0)
# ==============================================================================

telegram:
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ==============================================================================
# ORDER MANAGEMENT
# ==============================================================================

max_open_orders: 5
order_frequency: 3

min_switch_interval_seconds: 600    # 🚀 FIX: 1800→600 (10 min - faster switching)
min_hold_time_seconds: 1800        # 🔧 FIX: 300→1800 (30 min - allow grid sells time to execute!)
max_hold_time_seconds: 14400      # ✅ NEW: 4 hours max hold → force rotation to better opportunities (prevents 21h+ stuck positions)

# ==============================================================================
# STORY A1: MULTI-TIMEOUT LIFECYCLE (Professional Rotation)
# ==============================================================================
# Professional timeout strategy prevents stuck positions like VSN-EUR 21h issue
# Three-layer timeout system:
#   1. no_fill_timeout_sec: No fills → cancel orders + close (lightweight)
#   2. no_progress_timeout_sec: Stalled progress → start unwind
#   3. max_hold_time_seconds: Hard cap → forced rotation
# ==============================================================================

no_fill_timeout_sec: 1200         # ⏰ 20 min - no fills → cancel + close (no inventory)
no_progress_timeout_sec: 3600     # ⏰ 1 hour - no new fills → start unwind
close_grace_sec: 120              # ⏰ 2 min - graceful close window (maker → market fallback)

min_startup_wait_seconds: 60       # 🚀 FIX: 90→60 (1 min startup delay)

smart_switch_k: 2.0
switch_cost_multiplier: 2.5

# ==============================================================================
# DEBUG TRACE SYSTEM (Decision Transparency)
# ==============================================================================

debug_trace_enabled: true
debug_trace_format: compact
debug_trace_log_accepted: false
debug_trace_log_rejected: true

# ==============================================================================
# OBSERVABILITY (Phase 1A - Structured Events)
# ==============================================================================

observability:
  structured_events_enabled: true  # ENABLED for testing Phase 1C
  events_output_dir: "logs/events"
  buffer_size: 100
  why_no_trade_report_enabled: false  # Phase 1B (future)
  report_interval_seconds: 3600
