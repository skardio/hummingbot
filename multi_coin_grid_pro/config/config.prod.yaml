warmup_4h_strong_min: 0.5          # 4H moet duidelijk bullish zijn
warmup_1h_min_if_4h_strong: -1.5   # 🔧 FIX: -0.3→-1.5 (allow deeper pullbacks in strong 4H trends)

# ==============================================================================
# FEATURE 1.1: MARKET REGIME FILTER - BTC Trend Following (v3.3)
# ==============================================================================

market_regime:
  enabled: false
  btc_symbol: "BTC-EUR"

  # BTC trend thresholds (blokkeer entries als BTC trends te zwak zijn)
  btc_trend_1h_min_pct: -2.0         # BTC mag max -2% in 1h
  btc_trend_4h_min_pct: 0.0          # BTC 4h moet minimaal flat zijn
  btc_trend_24h_min_pct: -5.0        # BTC 24h mag -5% (normale correctie)

  # BTC dump detection (pauzeert trading bij crashes)
  dump_threshold_pct: -5.0           # BTC -5% in 1h = dump detected
  dump_pause_minutes: 60             # Wacht 1h na dump

  # Altcoin market breadth (hoeveel % coins is bullish?)
  altcoin_breadth_min_pct: 30.0      # Min 30% altcoins moet bullish zijn
  altcoin_breadth_sample_pairs:      # Sample coins om te checken
    - ETH-EUR
    - SOL-EUR
    - BNB-EUR
    - AVAX-EUR
    - LINK-EUR

  # Recovery detection (hervat trading na herstel)
  recovery_threshold_pct: 2.0        # BTC +2% = recovery signal

# ==============================================================================
# FEATURE 1.2: TIME-BASED TRADING RULES (v3.3) – HARDENED
# ==============================================================================

time_based_rules:
  enabled: false                                    # Tijdelijk uit voor tests

  # 🌙 Low liquidity hours (UTC) – Azië-focus
  low_liquidity_hours: [0, 1, 2]                   # 00:00-03:00 UTC (echt dun)
  low_liquidity_action: "monitor_only"              # Block entries during low liquidity

  # 📈 High liquidity window (UTC) – US/EU overlap
  high_liquidity_hours: [13, 14, 15, 16, 17, 18]   # 13:00-19:00 UTC (dicht orderboek)
  high_liquidity_bonus_pct: 10.0                    # +10% position size bonus

  # 🔐 NEW: Size multiplier cap (prevents stacking bonuses)
  max_total_size_multiplier: 1.2                    # Max 1.2x base size (even with all bonuses)

  # 🌅 Weekend behavior (dun orderboek, fake moves)
  weekend_trading_enabled: true                     # Handel op weekends, maar risico omlaag
  weekend_risk_multiplier: 0.5                      # 50% position size on Sat/Sun

  # 🔁 NEW: Conflict resolution (explicit priority)
  low_liquidity_overrides_weekend: true             # Nachtelijke lage liquidity blokkeert weekend bonus

  # 📅 Holidays (lage liquidity, spreads breder)
  holidays: ["2025-12-25", "2026-01-01"]            # Kerst + Nieuwjaar
  holiday_action: "reduce_size"                     # Reduce size op feestdagen
  holiday_risk_multiplier: 0.5                      # 50% position size on holidays

# ==============================================================================
# FEATURE 1.2b: LIQUIDITY-AWARE SMART SIZING (NEW - v3.4)
# ==============================================================================
# Intelligent position sizing based on market microstructure
# Prevents oversizing when multiple bonuses stack
# Ensures EUR-canonical risk limits are never exceeded
# ==============================================================================

liquidity_aware_sizing:
  enabled: true                                     # NEW FEATURE - enabled by default

  # Core principle: apply sizing rules in this order (to avoid stacking)
  sizing_priority: ["low_liquidity", "holiday", "weekend", "time_bonus", "regime_bonus", "volatility_bonus"]

  # Size calculation rules (applied sequentially, capped at max_total_size_multiplier)
  base_size_calculation: "capital_pct_daily"        # 2% of daily risk budget

  # Cumulative multiplier safety checks
  cumulative_check_enabled: true
  cumulative_log_level: "WARNING"                   # Warn if near cap

  # Time-based component (separate from low_liquidity blocking)
  time_bonus_scalar:
    high_liquidity: 1.10                            # +10% during 13:00-19:00 UTC
    normal_hours: 1.00                              # Baseline
    low_liquidity: 0.70                             # 30% reduction during [0-2] UTC

  # Market regime bonus (from BTC trend following)
  regime_bonus_scalar:
    strong_bull: 1.15                               # +15% if BTC trend strong
    neutral: 1.00                                   # Baseline if mixed
    weak_bear: 0.60                                 # 40% reduction if BTC weak

  # Volatility-based sizing (from ATR analysis)
  volatility_bonus_scalar:
    high_vol: 0.85                                  # Reduce 15% in high volatility
    normal_vol: 1.00                                # Baseline
    low_vol: 1.10                                   # +10% in calm markets

  # Final cap: prevents all bonuses from stacking beyond limit
  max_cumulative_multiplier: 1.20                   # Absolute cap = 1.2x

  # Logging
  log_sizing_calc: true                             # Log each sizing decision
  log_format: "JSON"                                # Machine-readable for audit trail

  # Example: size = base * min(time_bonus × regime_bonus × vol_bonus, 1.2)
  # This prevents 1.10 × 1.15 × 1.10 = 1.39x (OVERKILL!)
  # Instead: min(1.39, 1.2) = 1.2x (SAFE!)

# ==============================================================================
# FEATURE 1.3: PERFORMANCE TRACKING (v3.3)
# ==============================================================================

performance_tracking:
  enabled: true

  # Performance thresholds (waarschuwingen als hieronder)
  min_win_rate_pct: 45.0             # Min 45% win rate
  min_profit_factor: 1.2             # Min 1.2 profit factor
  min_sharpe_ratio: 0.5              # Min 0.5 Sharpe ratio
  max_drawdown_pct: 5.0              # Max 5% drawdown

  # Analysis windows
  lookback_trades: 20                # Laatste 20 trades analyseren
  lookback_days: 7                   # Laatste 7 dagen analyseren

  # Reporting
  report_interval_hours: 4           # Report elke 4 uur
  save_to_database: true             # Save metrics naar DB

  # Per-symbol breakdown
  track_per_symbol: true             # Track metrics per coin
  min_trades_per_symbol: 3           # Min 3 trades voor betrouwbare stats

# ==============================================================================
# ORDERBOOK DEPTH-BASED LIQUIDITY PROXY (Phase 3: LIVE - ACTIVE FILTERING)
# ==============================================================================

orderbook_liquidity:
  enabled: true                    # ✅ RE-ENABLED: Fixed "unknown ≠ illiquid" bug in trend_calculator
  mode: live                       # 🚀 LIVE MODE: Active depth filtering (unknown data doesn't block)
  regime_aware: false              # Phase 4: adaptive thresholds (BULL=8x, CHOP=5x, BEAR=10x)
  depth_pct_range: 0.5            # ±0.5% around mid price for depth calculation
  depth_levels: 10                # Top N orderbook levels per side to analyze
  min_depth_multiplier: 5.0       # Required depth = order_size × multiplier (5x = conservatief)
  use_for_ranking: false          # Phase 2: disabled (ranking feature)
  use_for_entry: true             # ✅ ENABLED: Only blocks on confirmed insufficient depth
  log_depth_metrics: true         # Log depth metrics for all evaluated coins

# ==============================================================================
# ORDERBOOK PREFETCH (Phase 2: LIVE - Active Prefetching)
# ==============================================================================

orderbook_prefetch:
  enabled: true                    # Enable prefetch observation
  mode: live                       # 🚀 LIVE MODE: Actually prefetch orderbooks (was: shadow = log-only)
  top_n: 3                         # Number of top candidates to prefetch
  max_subscriptions_per_minute: 6  # Rate limit protection

