  # Volatiliteit / ATR – geschikt voor grids
  max_atr_pct_for_grid: 6.0
  min_atr_pct_for_grid: 0.10       # 🔧 FIX: 0.2→0.10 (allow lower vol EUR pairs)

  # Short-term spikes
  max_5m_spike_pct: 2.5
