# ==============================================================================
# ADAPTIVE REGIME DETECTION & FILTERS (Phase 2: Active)
# ==============================================================================

adaptive_regime_detection:
  enabled: true                    # Enable regime detection
  logging_only: false              # 🔧 ACTIVE: Apply filters (pause in bear!)

  # Regime classification thresholds
  bull_score_min: 5.0              # Score >= 5 → BULL
  chop_score_min: -3.0             # Score in [-3, 5] → CHOP
  bear_score_max: -3.0             # Score < -3 → BEAR
  min_confidence: 0.65             # Minimum confidence to classify

  # Hysteresis settings (prevent flip-flopping)
  bull_min_duration_sec: 1800      # 30 min minimum in BULL
  chop_min_duration_sec: 900       # 15 min minimum in CHOP
  bear_min_duration_sec: 1800      # 30 min minimum in BEAR
  hysteresis_buffer: 1.0           # Score buffer for regime exit

  # Logging
  log_regime_changes: true
  log_filter_updates: true

adaptive_filters:
  # Baseline filters (OPTIMIZED for Kraken EUR bull market)
  baseline:
    rsi_buy_min: 25.0
    rsi_buy_max: 68.0               # 🛡️ Baseline: 68 (voorkom late pumps)
    rsi_extreme_min: 18.0           # 🚀 20→18 (catch oversold)
    vwap_max_deviation_pct: 30.0    # 🚀 18→30 (RENDER 24.96% was blocked!)
    max_up_accel_pct: 4.0           # 🚀 2.5→4 (strong momentum)
    max_down_accel_pct: -8.0        # 🚀 -4→-8 (SUI -7.47% was blocked!)
    atr_min_pct: 0.08               # 🚀 0.10→0.08 (more coins qualify)
    atr_max_pct: 7.0                # 🚀 6→7 (allow more volatile coins)
    spike_5m_max_pct: 4.0           # 🚀 3.0→4.0 (bigger moves OK)
    wick_ratio_min: 0.0
    grid_spacing_mult: 1.0
    max_active_grids: 4             # 🚀 TASK 1.2: 2→4 (was 2)
    entry_confidence_min: 0.65      # 🚀 0.70→0.65 (lower bar)

  # BULL regime: relaxed filters
  BULL:
    rsi_buy_max: 72.0               # 🛡️ Bull: 72 (iets ruimer voor momentum)
    vwap_max_deviation_pct: 20.0    # 🔧 FIX: 7.0→20.0 (allow entries in strong uptrends)
    max_up_accel_pct: 3.0
    max_down_accel_pct: -4.0
    atr_min_pct: 0.08
    spike_5m_max_pct: 3.5
    grid_spacing_mult: 1.2
    max_active_grids: 6             # 🚀 TASK 1.2: 3→6 (was 3)
    entry_confidence_min: 0.60

  # CHOP regime: strict filters
  CHOP:
    rsi_buy_max: 68.0               # 🛡️ Chop: 68 (gelijk aan baseline)
    vwap_max_deviation_pct: 10.0    # 🔧 FIX: 4.5→10.0 (allow altcoin pumps in chop)
    max_up_accel_pct: 1.8           # 🔧 FIX: 1.2→1.8 (allow some momentum)
    max_down_accel_pct: -2.5        # 🔧 FIX: -2.0→-2.5 (allow pullbacks)
    atr_min_pct: 0.10               # 🔧 FIX: 0.15→0.10 (Kraken EUR pairs)
    spike_5m_max_pct: 2.5           # 🔧 FIX: 2.0→2.5
    grid_spacing_mult: 0.8
    max_active_grids: 3             # 🚀 TASK 1.2: 1→3 (was 1)
    entry_confidence_min: 0.75

  # BEAR regime: Minimal trading (1 grid for mean-reversion opportunities)
  BEAR:
    rsi_buy_max: 62.0               # 🛡️ Bear: 62 (strengst)
    vwap_max_deviation_pct: 8.0
    max_up_accel_pct: 1.5
    max_down_accel_pct: -2.0
    atr_min_pct: 0.15
    spike_5m_max_pct: 2.0
    grid_spacing_mult: 1.5
    max_active_grids: 1             # 🔧 FIX: 0→1 (allow 1 grid for mean-reversion)
    entry_confidence_min: 0.90
    bear_allow_meanrev: false       # 🔧 INVENTORY FIX: No trading in bear!

