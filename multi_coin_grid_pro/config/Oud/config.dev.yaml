# Multi-Coin Grid Trading Strategy Configuration
# Environment: DEVELOPMENT
#
# This configuration file defines the parameters for the multi-coin grid trading strategy.
# The strategy automatically discovers and trades the best trending coins.

# Logging Configuration
log_level: DEBUG  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
                 # DEBUG: Detailed debugging information (very verbose)
                 # INFO: Normal operation messages (recommended)
                 # WARNING: Only warnings and errors
                 # ERROR: Only errors
                 # CRITICAL: Only critical errors

# Exchange Configuration
connector_name: kraken
quote_asset: EUR

# Paper Trading Mode
paper_trading: true  # DEV: Enable paper trading for testing

# =============================================================================
# WHITELISTED TRADING PAIRS
# =============================================================================
# IMPORTANT: Kraken WebSocket limit is ~25-30 subscriptions!
# DEV: Using fewer pairs for faster startup and testing
whitelisted_pairs:
  - USDC-EUR
  - USDT-EUR
  - BTC-EUR
  - ETH-EUR
  - SOL-EUR
  - ADA-EUR
  - XRP-EUR
  - DOGE-EUR
  - LINK-EUR
  - DOT-EUR
# Total: 10 pairs (minimal set for dev/testing)

# Coin Selection
# Option 1: Manual trading pairs (if set, bot will ONLY trade these coins)
manual_trading_pairs: null  # Example: ["XRP-EUR", "ADA-EUR", "SOL-EUR"]

# Option 2: Auto-discovery (only used if manual_trading_pairs is null/empty)
max_coins_to_monitor: 5  # DEV: Monitor fewer coins for faster testing
min_24h_volume_eur: 100000  # DEV: Lower volume threshold (€100k)
exclude_expensive_coins: true  # Exclude BTC/ETH

# Trend Detection
trend_lookback_minutes: 30  # DEV: Shorter lookback for faster testing
trend_min_change_pct: 0.15  # DEV: Lower threshold for testing
price_update_interval: 30  # Update prices every 30 seconds

# Phase 2.5: Multi-Timeframe Trend Engine
use_multi_timeframe: true  # Enable multi-timeframe analysis (60m, 240m, 1440m)
trend_lookback_short_minutes: 60  # 1-hour lookback
trend_lookback_mid_minutes: 240  # 4-hour lookback
trend_lookback_long_minutes: 1440  # 24-hour lookback
switch_threshold_percent: 1.5  # Minimum 1.5% trend_score difference to switch
exit_short_threshold: -1.0  # Exit if 60m trend < -1%
exit_mid_threshold: 0.5  # Exit if 240m trend < +0.5%

# Switch Management
min_switch_interval_seconds: 300  # DEV: 5 minutes for faster testing
min_hold_time_seconds: 300  # DEV: 5 minutes minimum hold time
smart_switch_k: 1.5  # Volatility multiplier for smart switch threshold
switch_cost_multiplier: 1.5  # DEV: Lower multiplier for testing

# Grid Configuration
grid_range_pct_down: 3.0  # Place buy orders 3% below current price
grid_range_pct_up: 8.0  # Place sell orders 8% above current price
num_grids: 3  # Number of grid levels
use_atr_grid_ranges: true  # Use ATR-based dynamic grid ranges
atr_multiplier_down: 1.0  # Grid lower = price - (ATR * multiplier_down)
atr_multiplier_up: 1.5  # Grid upper = price + (ATR * multiplier_up)
use_asymmetric_grids: true  # Adjust grid distribution based on trend direction
smart_refill_threshold_pct: 3.0  # Rebuild grid if price moved >3% since last grid

# Capital Management
total_amount_quote: 50  # DEV: €50 for testing
min_order_amount_quote: 10  # Minimum €10 per order

# Risk Management
stop_loss_pct: 0.08  # Stop loss at -8%
take_profit_pct: 0.02  # Take profit at +2% per grid level

# Phase 1.4: Position Size Limits
max_exposure_per_coin_pct: 0.20  # Max 20% of capital per coin
max_total_exposure_pct: 0.90  # Max 90% of capital total

# Order Management
max_open_orders: 5  # Maximum 5 open orders at once
order_frequency: 3  # Wait 3 seconds between order placements

# PHASE 1: Slippage Protection (Fix #1)
max_entry_spread_pct: 0.5  # Maximum acceptable bid-ask spread (0.5% = professional standard)

# PHASE 1: Drawdown & Loss Limits (Fix #2 & #3)
max_daily_loss_pct: 5.0    # Max daily loss percentage
max_weekly_loss_pct: 10.0  # Max weekly loss percentage
max_monthly_loss_pct: 15.0 # Max monthly loss percentage
max_daily_loss_eur: 10.0   # Max daily loss in EUR (€10 for dev testing)

# Phase 1.2: Circuit Breaker
circuit_breaker_volatility_pct: 0.05  # 5% volatility threshold
circuit_breaker_time_window: 60  # 1 minute window

# Phase 1.3: API Error Handling
api_error_max_retries: 3  # Max consecutive errors before pause
api_error_backoff_time: 60  # Wait 60 seconds before retry

blacklist:
  - CCD-EUR
  - FARTCOIN-EUR
  - 0G-EUR
  - 1INCH-EUR
  - 2Z-EUR
  - AB-EUR
  - ACA-EUR
  - USELESS-EUR
  - CC-EUR
