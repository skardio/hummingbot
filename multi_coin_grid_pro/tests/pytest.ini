[pytest]
# Pytest configuration for multi_coin_grid_pro tests

# Ignore tests with missing Hummingbot core dependencies
# These are old/deprecated tests that require full Hummingbot setup
norecursedirs =
    .git
    __pycache__

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show summary
addopts = -v --tb=short --strict-markers -ra

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    stress: Stress tests
    slow: Slow running tests
    requires_hummingbot: Tests requiring full Hummingbot core
